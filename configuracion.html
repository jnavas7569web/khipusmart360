<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KhipuSmart360 - Configuración</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --azul: #5c6bc0; --gris-fondo: #f4f7f6; --blanco: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--gris-fondo); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { max-width: 400px; width: 90%; background: var(--blanco); padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: var(--azul); text-align: center; margin-bottom: 10px; }
        .form-group { margin-bottom: 20px; position: relative; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; font-size: 0.9rem; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1rem; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--azul); box-shadow: 0 0 5px rgba(92, 107, 192, 0.2); }
        .btn-cambiar { width: 100%; padding: 15px; background: var(--azul); border: none; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 1rem; transition: 0.3s; }
        .btn-cambiar:hover { background: #3f51b5; transform: translateY(-2px); }
        .btn-volver { display: block; text-align: center; margin-top: 20px; text-decoration: none; color: #888; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="container">
    <h2><i class="fa-solid fa-shield-halved"></i> Seguridad</h2>
    <p style="text-align: center; color: #666; font-size: 0.85rem; margin-bottom: 25px;">Cambia tu contraseña de acceso.</p>

    <form id="form-config">
        <div class="form-group">
            <label>Contraseña Actual:</label>
            <input type="password" id="clave-vieja" required placeholder="••••••••">
        </div>

        <div class="form-group">
            <label>Nueva Contraseña:</label>
            <input type="password" id="clave-nueva" required placeholder="Mínimo 6 caracteres">
        </div>

        <button type="submit" id="btn-submit" class="btn-cambiar">ACTUALIZAR CONTRASEÑA</button>
    </form>

    <a href="dashboard.html" class="btn-volver"><i class="fa-solid fa-arrow-left"></i> Regresar al Dashboard</a>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, EmailAuthProvider, reauthenticateWithCredential, updatePassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBsEeL_xG-koVvHWpTot5f1PeqNQo-eN8o",
        authDomain: "khipusmart360.firebaseapp.com",
        projectId: "khipusmart360",
        storageBucket: "khipusmart360.firebasestorage.app",
        messagingSenderId: "240593523716",
        appId: "1:240593523716:web:03cbfe1f8f41f1b2a75151"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let nombreUsuario = "Usuario";

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            // Obtenemos el nombre del usuario desde Firestore para el correo/mensaje
            const docSnap = await getDoc(doc(db, "usuarios", user.uid));
            if (docSnap.exists()) nombreUsuario = docSnap.data().nombre_completo;
        } else {
            window.location.href = "index.html";
        }
    });

    document.getElementById('form-config').addEventListener('submit', async (e) => {
        e.preventDefault();
        const user = auth.currentUser;
        const claveVieja = document.getElementById('clave-vieja').value;
        const claveNueva = document.getElementById('clave-nueva').value;
        const btn = document.getElementById('btn-submit');

        if (claveNueva.length < 6) {
            Swal.fire('KhipuSmart Informa', 'La nueva clave debe tener al menos 6 caracteres.', 'warning');
            return;
        }

        btn.disabled = true;
        btn.innerText = "Procesando...";

       try {
            // 1. RE-AUTENTICAR
            const credential = EmailAuthProvider.credential(user.email, claveVieja);
            await reauthenticateWithCredential(user, credential);

            // 2. ACTUALIZAR CLAVE
            await updatePassword(user, claveNueva);

            // 3. MENSAJE DE ÉXITO ELEGANTE (Aquí va lo que me pasaste)
            Swal.fire({
                title: '¡Clave Actualizada!',
                html: `
                    <div style="text-align: left; background: #f0f4ff; padding: 15px; border-radius: 10px; border: 1px solid #5c6bc0;">
                        <p>Estimado <b>${nombreUsuario}</b>,</p>
                        <p>Su acceso a <b>KhipuSmart360</b> ha sido actualizado.</p>
                        <p>Su nueva clave es: <span style="color: #ef5350; font-weight: bold;">${claveNueva}</span></p>
                        <hr>
                        <small>Por seguridad, no comparta esta información con nadie.</small>
                    </div>
                `,
                icon: 'success',
                confirmButtonText: 'Entendido, volver al Inicio',
                confirmButtonColor: '#5c6bc0'
            }).then(() => {
                window.location.href = "dashboard.html";
            });

 
            // ... resto del código de error (catch)
        } catch (error) {
            console.error(error);
            let mensajeError = "La contraseña actual es incorrecta.";
            if (error.code === 'auth/too-many-requests') mensajeError = "Muchos intentos fallidos. Intente más tarde.";
            
            Swal.fire('Error de Seguridad', mensajeError, 'error');
            btn.disabled = false;
            btn.innerText = "ACTUALIZAR CONTRASEÑA";
        }
    });
</script>
</body>
</html>
