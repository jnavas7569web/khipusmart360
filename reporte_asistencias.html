<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KhipuSmart360 - Reporte Final</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --azul: #1a237e; --gris-fondo: #f4f7f6; }
        body { background-color: var(--gris-fondo); font-family: 'Segoe UI', sans-serif; font-size: 11px; }
        .header-reporte { background: linear-gradient(135deg, #1a237e 0%, #5c6bc0 100%); color: white; }
        .badge { padding: 3px 10px; border-radius: 6px; font-weight: 800; text-transform: uppercase; font-size: 9px; border: 1px solid; }
        .badge-true { background: #dcfce7; color: #166534; border-color: #166534; }
        .badge-false { background: #fee2e2; color: #991b1b; border-color: #991b1b; }
        .badge-atraso { background: #fef3c7; color: #92400e; border-color: #92400e; }
        .badge-justificado { background: #e0f2fe; color: #075985; border-color: #075985; }
        @media print { .no-print { display: none !important; } body { padding: 0; background: white; } }
    </style>
</head>
<body class="p-4 md:p-8">

<div class="max-w-6xl mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden border">
    <div class="header-reporte p-6">
        <h1 class="text-xl font-black tracking-tighter uppercase">KhipuSmart360 - Reporte de Asistencia</h1>
        <p id="info-filtros" class="text-indigo-100 text-[10px] font-bold mt-1 uppercase tracking-widest italic">Cargando...</p>
    </div>

    <div class="p-6">
        <div class="overflow-x-auto border rounded-2xl mb-6">
            <table class="w-full text-left text-xs">
                <thead class="bg-gray-100 border-b border-gray-200">
                    <tr id="cabecera-tabla" class="text-indigo-900 font-black uppercase text-[10px] tracking-widest">
                        <th class="px-6 py-4 w-12 text-center">#</th>
                        <th class="px-6 py-4">Estudiante</th>
                        <th class="px-6 py-4 text-center">Estado / Resumen</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-tabla" class="divide-y divide-gray-100 text-gray-700 font-medium">
                    <tr><td colspan="3" class="text-center py-20 italic">Buscando en la base de datos...</td></tr>
                </tbody>
            </table>
        </div>

        <div id="resumen-dia" class="grid grid-cols-2 md:grid-cols-4 gap-4 hidden mb-6 text-center">
            <div class="bg-gray-50 p-4 rounded-xl border"><span class="block text-[9px] font-black text-gray-400 uppercase">Total</span><span id="res-total" class="text-xl font-black text-indigo-900">0</span></div>
            <div class="bg-green-50 p-4 rounded-xl border border-green-200"><span class="block text-[9px] font-black text-green-600 uppercase">P</span><span id="res-presentes" class="text-xl font-black text-green-700">0</span></div>
            <div class="bg-red-50 p-4 rounded-xl border border-red-200"><span class="block text-[9px] font-black text-red-600 uppercase">F</span><span id="res-faltas" class="text-xl font-black text-red-700">0</span></div>
            <div class="bg-blue-50 p-4 rounded-xl border border-blue-200"><span class="block text-[9px] font-black text-blue-600 uppercase">J</span><span id="res-justificados" class="text-xl font-black text-blue-700">0</span></div>
        </div>

        <div id="contenedor-grafico" class="p-6 bg-gray-50 rounded-2xl border hidden">
            <canvas id="graficoFaltas" style="max-height: 200px;"></canvas>
        </div>

        <div class="mt-8 flex justify-between items-center no-print">
            <button onclick="history.back()" class="text-gray-400 hover:text-indigo-600 font-bold text-xs uppercase tracking-widest">
                <i class="fa-solid fa-chevron-left mr-2"></i> Ajustar Filtros
            </button>
            <button onclick="window.print()" class="bg-indigo-600 hover:bg-indigo-800 text-white px-8 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest shadow-lg">
                <i class="fa-solid fa-print mr-2"></i> Imprimir Reporte
            </button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, Timestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBsEeL_xG-koVvHWpTot5f1PeqNQo-eN8o",
        authDomain: "khipusmart360.firebaseapp.com",
        projectId: "khipusmart360",
        storageBucket: "khipusmart360.firebasestorage.app",
        messagingSenderId: "240593523716",
        appId: "1:240593523716:web:03cbfe1f8f41f1b2a75151"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function cargarReporte() {
        const params = new URLSearchParams(window.location.search);
        const cursoRaw = params.get('curso'); 
        const desdeStr = params.get('desde');
        const hastaStr = params.get('hasta');

        if(!cursoRaw || !desdeStr || !hastaStr) return;

        const [grado, paralelo] = cursoRaw.split('-');
        const esMismoDia = (desdeStr === hastaStr);
        document.getElementById('info-filtros').innerText = `GRADO: ${grado} "${paralelo}" | DEL ${desdeStr} AL ${hastaStr}`;

        // Definir Rango de Fechas
        const fInicio = new Date(desdeStr + "T00:00:00");
        const fFin = new Date(hastaStr + "T23:59:59");

        const tabla = document.getElementById('cuerpo-tabla');
        const cabecera = document.getElementById('cabecera-tabla');

        try {
            // 1. Obtener Estudiantes del curso (id_grado es String "7")
            const qEst = query(collection(db, "estudiantes"), 
                               where("id_grado", "==", grado), 
                               where("id_paralelo", "==", paralelo));
            
            const snapEst = await getDocs(qEst);
            let listaEst = [];
            snapEst.forEach(d => {
                listaEst.push({ id: d.id, ...d.data() });
            });
            
            // Ordenar por apellidos (JS)
            listaEst.sort((a, b) => (a.apellidos || "").localeCompare(b.apellidos || ""));

            if (listaEst.length === 0) {
                tabla.innerHTML = '<tr><td colspan="10" class="text-center py-20 italic font-bold">No hay estudiantes registrados en este curso.</td></tr>';
                return;
            }

            // 2. Traer TODAS las asistencias de este curso (Simplificado para evitar errores de índices)
            const qAsisGlobal = query(collection(db, "asistencias_diarias"), 
                where("id_grado", "==", grado),
                where("id_paralelo", "==", paralelo)
            );
            
            const snapAsisGlobal = await getDocs(qAsisGlobal);
            const todasAsis = snapAsisGlobal.docs.map(d => d.data());

            tabla.innerHTML = "";
            let statsDia = { total: 0, p: 0, f: 0, a: 0, j: 0 };
            let dataGrafico = [];

            // Configurar Cabeceras
            if (esMismoDia) {
                cabecera.innerHTML = `<th class="px-6 py-4 w-12 text-center">#</th><th class="px-6 py-4">Apellidos y Nombres</th><th class="px-6 py-4 text-center">Asistencia</th>`;
                document.getElementById('resumen-dia').classList.remove('hidden');
            } else {
                cabecera.innerHTML = `<th class="px-6 py-4 w-12 text-center">#</th><th class="px-6 py-4">Estudiante</th><th class="px-6 py-4">Representante / Tel.</th><th class="px-6 py-4 text-center">P - F - A - J</th>`;
                document.getElementById('contenedor-grafico').classList.remove('hidden');
            }

            let num = 1;
            for (const est of listaEst) {
                // Filtrar las asistencias de este estudiante dentro del rango de fechas
                const misAsis = todasAsis.filter(a => {
                    const fechaAsis = a.fecha.toDate();
                    return a.id_estudiante === est.id && fechaAsis >= fInicio && fechaAsis <= fFin;
                });
                
                let cnt = { p: 0, f: 0, a: 0, j: 0 };
                let ultimoE = "---";

                misAsis.forEach(data => {
                    const edo = String(data.asistencia).toLowerCase();
                    if (edo === "true") { cnt.p++; ultimoE = "true"; }
                    else if (edo === "false") { cnt.f++; ultimoE = "false"; }
                    else if (edo === "atraso") { cnt.a++; ultimoE = "atraso"; }
                    else if (edo === "justificado") { cnt.j++; ultimoE = "justificado"; }
                });

                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 border-b border-gray-100";

                if (esMismoDia) {
                    statsDia.total++;
                    if(ultimoE === "true") statsDia.p++;
                    else if(ultimoE === "false") statsDia.f++;
                    else if(ultimoE === "justificado") statsDia.j++;
                    else if(ultimoE === "atraso") statsDia.a++;

                    tr.innerHTML = `
                        <td class="px-6 py-3 font-black text-gray-300 text-center">${num++}</td>
                        <td class="px-6 py-3 font-bold uppercase text-indigo-900">${est.apellidos || ''} ${est.Nombres || ''}</td>
                        <td class="px-6 py-3 text-center"><span class="badge badge-${ultimoE}">${traducir(ultimoE)}</span></td>
                    `;
                } else {
                    dataGrafico.push({ n: (est.apellidos || "E").split(' ')[0], prob: cnt.f + cnt.a });
                    tr.innerHTML = `
                        <td class="px-6 py-3 font-black text-gray-300 text-center">${num++}</td>
                        <td class="px-6 py-3 font-bold uppercase text-indigo-900">${est.apellidos || ''} ${est.Nombres || ''}</td>
                        <td class="px-6 py-3 text-[10px]"><b>${est.representante || '---'}</b><br><span class="text-blue-500 font-bold">${est.telefono_repre || ''}</span></td>
                        <td class="px-6 py-3 text-center font-bold font-mono text-[10px]">
                            <span class="text-green-600">${cnt.p}</span> - <span class="text-red-600">${cnt.f}</span> - <span class="text-orange-500">${cnt.a}</span> - <span class="text-blue-500">${cnt.j}</span>
                        </td>
                    `;
                }
                tabla.appendChild(tr);
            }

            if (esMismoDia) {
                document.getElementById('res-total').innerText = statsDia.total;
                document.getElementById('res-presentes').innerText = statsDia.p;
                document.getElementById('res-faltas').innerText = statsDia.f;
                document.getElementById('res-justificados').innerText = statsDia.j;
            } else {
                dibujarChart(dataGrafico);
            }
        } catch (err) { console.error("Error cargando reporte:", err); }
    }

    function traducir(v) {
        if(v === "true") return "Asistió";
        if(v === "false") return "Falta";
        if(v === "atraso") return "Atraso";
        if(v === "justificado") return "Justificado";
        return "N/A";
    }

    function dibujarChart(datos) {
        const top = datos.sort((a,b) => b.prob - a.prob).filter(d => d.prob > 0).slice(0, 5);
        if (top.length === 0) return;
        const ctx = document.getElementById('graficoFaltas').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: top.map(d => d.n),
                datasets: [{ label: 'Faltas + Atrasos', data: top.map(d => d.prob), backgroundColor: '#1a237e', borderRadius: 6 }]
            },
            options: { responsive: true, plugins: { legend: { display: false } } }
        });
    }

    cargarReporte();
</script>
</body>
</html>
