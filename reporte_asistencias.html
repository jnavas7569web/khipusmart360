<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KhipuSmart360 - Informe de Asistencia</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --azul: #1a237e; --gris-fondo: #f4f7f6; }
        body { background-color: var(--gris-fondo); font-family: 'Segoe UI', sans-serif; font-size: 12px; }
        .header-reporte { background: linear-gradient(135deg, #1a237e 0%, #5c6bc0 100%); color: white; }
        .badge { padding: 2px 8px; border-radius: 6px; font-weight: 800; text-transform: uppercase; font-size: 9px; }
        .badge-true { background: #dcfce7; color: #166534; border: 1px solid #166534; }
        .badge-false { background: #fee2e2; color: #991b1b; border: 1px solid #991b1b; }
        .badge-atraso { background: #fef3c7; color: #92400e; border: 1px solid #92400e; }
        .badge-justificado { background: #e0f2fe; color: #075985; border: 1px solid #075985; }
        @media print { .no-print { display: none !important; } .print-shadow { shadow: none !important; border: 1px solid #eee; } }
    </style>
</head>
<body class="p-4 md:p-8">

<div class="max-w-5xl mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden print-shadow">
    <div class="header-reporte p-6 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-black tracking-tighter">KHIPUSMART360 - REPORTE DE ASISTENCIA</h1>
            <p id="info-filtros" class="text-indigo-100 text-[10px] font-bold mt-1 uppercase tracking-widest"></p>
        </div>
        <img src="https://cdn-icons-png.flaticon.com/512/2991/2991108.png" class="w-12 h-12 opacity-20 no-print">
    </div>

    <div class="p-6">
        <div class="overflow-x-auto border rounded-2xl">
            <table class="w-full text-left">
                <thead class="bg-gray-100 border-b border-gray-200">
                    <tr id="cabecera-tabla" class="text-indigo-900 font-black uppercase text-[10px] tracking-widest">
                        </tr>
                </thead>
                <tbody id="cuerpo-tabla" class="divide-y divide-gray-100 text-gray-700 font-medium">
                    <tr>
                        <td colspan="10" class="text-center py-20 italic">Procesando información de Firebase...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div id="resumen-dia" class="mt-6 grid grid-cols-2 md:grid-cols-4 gap-4 hidden">
            <div class="bg-gray-50 p-4 rounded-xl border text-center">
                <span class="block text-[10px] font-black text-gray-400 uppercase">Total Estudiantes</span>
                <span id="res-total" class="text-xl font-black text-indigo-900">0</span>
            </div>
            <div class="bg-green-50 p-4 rounded-xl border border-green-200 text-center">
                <span class="block text-[10px] font-black text-green-600 uppercase">Asistieron</span>
                <span id="res-presentes" class="text-xl font-black text-green-700">0</span>
            </div>
            <div class="bg-red-50 p-4 rounded-xl border border-red-200 text-center">
                <span class="block text-[10px] font-black text-red-600 uppercase">Faltaron</span>
                <span id="res-faltas" class="text-xl font-black text-red-700">0</span>
            </div>
            <div class="bg-blue-50 p-4 rounded-xl border border-blue-200 text-center">
                <span class="block text-[10px] font-black text-blue-600 uppercase">Justificados</span>
                <span id="res-justificados" class="text-xl font-black text-blue-700">0</span>
            </div>
        </div>

        <div id="contenedor-grafico" class="mt-8 p-6 bg-gray-50 rounded-2xl border hidden">
            <h3 class="text-center font-black text-gray-400 text-[10px] uppercase mb-4 tracking-widest">Top 5 Estudiantes con más Faltas/Atrasos</h3>
            <canvas id="graficoFaltas" style="max-height: 250px;"></canvas>
        </div>

        <div class="mt-8 flex justify-between items-center no-print">
            <button onclick="history.back()" class="text-gray-400 hover:text-indigo-600 font-bold text-xs uppercase transition-all">
                <i class="fa-solid fa-chevron-left mr-2"></i> Volver
            </button>
            <button onclick="window.print()" class="bg-indigo-600 hover:bg-indigo-800 text-white px-8 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest shadow-lg transition-all transform active:scale-95">
                <i class="fa-solid fa-print mr-2"></i> Imprimir Reporte
            </button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, doc, getDoc, Timestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBsEeL_xG-koVvHWpTot5f1PeqNQo-eN8o",
        authDomain: "khipusmart360.firebaseapp.com",
        projectId: "khipusmart360",
        storageBucket: "khipusmart360.firebasestorage.app",
        messagingSenderId: "240593523716",
        appId: "1:240593523716:web:03cbfe1f8f41f1b2a75151"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function generarReporte() {
        const params = new URLSearchParams(window.location.search);
        const cursoRaw = params.get('curso');
        const desdeStr = params.get('desde');
        const hastaStr = params.get('hasta');

        if(!cursoRaw || !desdeStr) return;
        const [grado, paralelo] = cursoRaw.split('-');
        const esMismoDia = (desdeStr === hastaStr);
        
        document.getElementById('info-filtros').innerText = `Curso: ${grado} "${paralelo}" | Periodo: ${desdeStr} al ${hastaStr}`;

        const fInicio = new Date(desdeStr + "T00:00:00");
        const fFin = new Date(hastaStr + "T23:59:59");
        const tabla = document.getElementById('cuerpo-tabla');
        const cabecera = document.getElementById('cabecera-tabla');

        try {
            // 1. Obtener Estudiantes
            const qEst = query(collection(db, "estudiantes"), where("id_grado", "==", grado), where("id_paralelo", "==", paralelo));
            const snapEst = await getDocs(qEst);
            let listaEstudiantes = [];
            snapEst.forEach(d => listaEstudiantes.push({ id: d.id, ...d.data() }));
            
            // Ordenar por Apellidos (Manual JS)
            listaEstudiantes.sort((a, b) => (a.apellidos || "").localeCompare(b.apellidos || ""));

            tabla.innerHTML = "";
            let statsDia = { total: 0, p: 0, f: 0, a: 0, j: 0 };
            let dataParaGrafico = [];

            if (esMismoDia) {
                cabecera.innerHTML = `<th class="px-6 py-4 w-12">#</th><th class="px-6 py-4 text-center">Apellidos y Nombres</th><th class="px-6 py-4 text-center">Estado</th>`;
                document.getElementById('resumen-dia').classList.remove('hidden');
            } else {
                cabecera.innerHTML = `<th class="px-6 py-4 w-12">#</th><th class="px-6 py-4">Estudiante</th><th class="px-6 py-4">Representante / Tel.</th><th class="px-6 py-4 text-center">Resumen (P-F-A-J)</th>`;
                document.getElementById('contenedor-grafico').classList.remove('hidden');
            }

            let num = 1;
            for (const est of listaEstudiantes) {
                const qAsis = query(collection(db, "asistencias_diarias"), 
                    where("id_estudiante", "==", est.id),
                    where("fecha", ">=", Timestamp.fromDate(fInicio)),
                    where("fecha", "<=", Timestamp.fromDate(fFin))
                );
                const snapAsis = await getDocs(qAsis);
                
                let conteo = { presente: 0, falta: 0, atraso: 0, justificado: 0 };
                let ultimoEstado = "---";

                snapAsis.forEach(asisDoc => {
                    const d = asisDoc.data();
                    if (d.asistencia === "true") { conteo.presente++; ultimoEstado = "true"; }
                    else if (d.asistencia === "false") { conteo.falta++; ultimoEstado = "false"; }
                    else if (d.asistencia === "atraso") { conteo.atraso++; ultimoEstado = "atraso"; }
                    else if (d.asistencia === "justificado") { conteo.justificado++; ultimoEstado = "justificado"; }
                });

                const tr = document.createElement('tr');
                if (esMismoDia) {
                    statsDia.total++;
                    if(ultimoEstado === "true") statsDia.p++;
                    else if(ultimoEstado === "false") statsDia.f++;
                    else if(ultimoEstado === "justificado") statsDia.j++;

                    tr.innerHTML = `
                        <td class="px-6 py-3 font-black text-gray-300 text-center">${num++}</td>
                        <td class="px-6 py-3 font-bold uppercase text-indigo-900">${est.apellidos} ${est.Nombres}</td>
                        <td class="px-6 py-3 text-center"><span class="badge badge-${ultimoEstado}">${traducir(ultimoEstado)}</span></td>
                    `;
                } else {
                    dataParaGrafico.push({ nombre: est.apellidos.split(' ')[0], totalProblemas: conteo.falta + conteo.atraso });
                    tr.innerHTML = `
                        <td class="px-6 py-3 font-black text-gray-300">${num++}</td>
                        <td class="px-6 py-3 font-bold uppercase text-indigo-900">${est.apellidos} ${est.Nombres}</td>
                        <td class="px-6 py-3 text-[10px]"><b>${est.Representante || '---'}</b><br><span class="text-blue-500">${est.Telefono || ''}</span></td>
                        <td class="px-6 py-3 text-center">
                            <span class="text-green-600 font-black">P:${conteo.presente}</span> | 
                            <span class="text-red-600 font-black">F:${conteo.falta}</span> | 
                            <span class="text-orange-500 font-black">A:${conteo.atraso}</span> | 
                            <span class="text-blue-500 font-black">J:${conteo.justificado}</span>
                        </td>
                    `;
                }
                tabla.appendChild(tr);
            }

            if(esMismoDia) {
                document.getElementById('res-total').innerText = statsDia.total;
                document.getElementById('res-presentes').innerText = statsDia.p;
                document.getElementById('res-faltas').innerText = statsDia.f;
                document.getElementById('res-justificados').innerText = statsDia.j;
            } else {
                crearGrafico(dataParaGrafico);
            }

        } catch (e) { console.error(e); }
    }

    function traducir(e) {
        if(e === "true") return "Presente";
        if(e === "false") return "Falta";
        if(e === "atraso") return "Atraso";
        if(e === "justificado") return "Justificado";
        return "Sin Registro";
    }

    function crearGrafico(datos) {
        const top5 = datos.sort((a, b) => b.totalProblemas - a.totalProblemas).slice(0, 5);
        const ctx = document.getElementById('graficoFaltas').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: top5.map(d => d.nombre),
                datasets: [{
                    label: 'Suma de Faltas + Atrasos',
                    data: top5.map(d => d.totalProblemas),
                    backgroundColor: '#ef5350',
                    borderRadius: 10
                }]
            },
            options: { responsive: true, plugins: { legend: { display: false } } }
        });
    }

    generarReporte();
</script>
</body>
</html>
