<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, Timestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBsEeL_xG-koVvHWpTot5f1PeqNQo-eN8o",
        authDomain: "khipusmart360.firebaseapp.com",
        projectId: "khipusmart360",
        storageBucket: "khipusmart360.firebasestorage.app",
        messagingSenderId: "240593523716",
        appId: "1:240593523716:web:03cbfe1f8f41f1b2a75151"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function cargarReporte() {
        const params = new URLSearchParams(window.location.search);
        const cursoRaw = params.get('curso');
        const desdeStr = params.get('desde');
        const hastaStr = params.get('hasta');

        if(!cursoRaw || !desdeStr || !hastaStr) return;
        const [grado, paralelo] = cursoRaw.split('-');
        const esMismoDia = (desdeStr === hastaStr);
        
        document.getElementById('info-filtros').innerText = `GRADO: ${grado} "${paralelo}" | PERIODO: DEL ${desdeStr} AL ${hastaStr}`;

        // CORRECCIÓN DE FECHA: Crear el objeto exacto de medianoche para que coincida con tu Firebase
        const fInicio = new Date(desdeStr + "T00:00:00");
        const fFin = new Date(hastaStr + "T23:59:59");

        const tabla = document.getElementById('cuerpo-tabla');
        const cabecera = document.getElementById('cabecera-tabla');

        try {
            // 1. Obtener Estudiantes del curso (Filtro por id_grado e id_paralelo)
            const qEst = query(collection(db, "estudiantes"), 
                               where("id_grado", "==", grado), 
                               where("id_paralelo", "==", paralelo));
            
            const snapEst = await getDocs(qEst);
            let listaEst = [];
            snapEst.forEach(d => listaEst.push({ id: d.id, ...d.data() }));
            
            // Ordenar por apellidos (JS)
            listaEst.sort((a, b) => (a.apellidos || "").localeCompare(b.apellidos || ""));

            if (listaEst.length === 0) {
                tabla.innerHTML = '<tr><td colspan="10" class="text-center py-20 italic font-bold">No se encontraron estudiantes registrados en ${grado} "${paralelo}".</td></tr>';
                return;
            }

            tabla.innerHTML = "";
            let statsDia = { total: 0, p: 0, f: 0, a: 0, j: 0 };
            let dataGrafico = [];

            // Cabeceras
            if (esMismoDia) {
                cabecera.innerHTML = `<th class="px-6 py-4 w-12 text-center">#</th><th class="px-6 py-4 text-left">Apellidos y Nombres</th><th class="px-6 py-4 text-center">Asistencia</th>`;
                document.getElementById('resumen-dia').classList.remove('hidden');
            } else {
                cabecera.innerHTML = `<th class="px-6 py-4 w-12 text-center">#</th><th class="px-6 py-4">Estudiante</th><th class="px-6 py-4">Representante / Teléfono</th><th class="px-6 py-4 text-center">Totales (P-F-A-J)</th>`;
                document.getElementById('contenedor-grafico').classList.remove('hidden');
            }

            let num = 1;
            for (const est of listaEst) {
                // Buscamos asistencias para este estudiante específico
                const qAsis = query(collection(db, "asistencias_diarias"), 
                    where("id_estudiante", "==", est.id),
                    where("fecha", ">=", Timestamp.fromDate(fInicio)),
                    where("fecha", "<=", Timestamp.fromDate(fFin))
                );
                
                const snapAsis = await getDocs(qAsis);
                let cnt = { p: 0, f: 0, a: 0, j: 0 };
                let ultimoE = "---";

                snapAsis.forEach(dAsis => {
                    const data = dAsis.data();
                    if (data.asistencia === "true") { cnt.p++; ultimoE = "true"; }
                    else if (data.asistencia === "false") { cnt.f++; ultimoE = "false"; }
                    else if (data.asistencia === "atraso") { cnt.a++; ultimoE = "atraso"; }
                    else if (data.asistencia === "justificado") { cnt.j++; ultimoE = "justificado"; }
                });

                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 border-b border-gray-100";

                if (esMismoDia) {
                    statsDia.total++;
                    if(ultimoE === "true") statsDia.p++;
                    else if(ultimoE === "false") statsDia.f++;
                    else if(ultimoE === "justificado") statsDia.j++;

                    tr.innerHTML = `
                        <td class="px-6 py-3 font-black text-gray-300 text-center">${num++}</td>
                        <td class="px-6 py-3 font-bold uppercase text-indigo-900">${est.apellidos || ''} ${est.Nombres || ''}</td>
                        <td class="px-6 py-3 text-center"><span class="badge badge-${ultimoE}">${traducir(ultimoE)}</span></td>
                    `;
                } else {
                    dataGrafico.push({ n: (est.apellidos || "").split(' ')[0], prob: cnt.f + cnt.a });
                    tr.innerHTML = `
                        <td class="px-6 py-3 font-black text-gray-300 text-center">${num++}</td>
                        <td class="px-6 py-3 font-bold uppercase text-indigo-900">${est.apellidos || ''} ${est.Nombres || ''}</td>
                        <td class="px-6 py-3 text-[10px]"><b>${est.representante || '---'}</b><br><span class="text-blue-500 font-bold">${est.telefono_repre || ''}</span></td>
                        <td class="px-6 py-3 text-center font-bold">
                            <span class="text-green-600">P:${cnt.p}</span> | <span class="text-red-600 font-bold">F:${cnt.f}</span> | <span class="text-orange-500">A:${cnt.a}</span> | <span class="text-blue-500">J:${cnt.j}</span>
                        </td>
                    `;
                }
                tabla.appendChild(tr);
            }

            if (esMismoDia) {
                document.getElementById('res-total').innerText = statsDia.total;
                document.getElementById('res-presentes').innerText = statsDia.p;
                document.getElementById('res-faltas').innerText = statsDia.f;
                document.getElementById('res-justificados').innerText = statsDia.j;
            } else {
                dibujarChart(dataGrafico);
            }
        } catch (err) { console.error("Error en reporte:", err); }
    }

    function traducir(v) {
        if(v === "true") return "Presente";
        if(v === "false") return "Falta";
        if(v === "atraso") return "Atraso";
        if(v === "justificado") return "Justificado";
        return "No registrado";
    }

    function dibujarChart(datos) {
        const top = datos.sort((a,b) => b.prob - a.prob).filter(d => d.prob > 0).slice(0, 5);
        if (top.length === 0) {
            document.getElementById('contenedor-grafico').innerHTML = '<p class="text-center py-4 text-gray-400 font-bold uppercase text-[9px]">No hay faltas o atrasos en este periodo para graficar.</p>';
            return;
        }
        const ctx = document.getElementById('graficoFaltas').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: top.map(d => d.n),
                datasets: [{ label: 'Faltas + Atrasos', data: top.map(d => d.prob), backgroundColor: '#1a237e', borderRadius: 6 }]
            },
            options: { responsive: true, plugins: { legend: { display: false } } }
        });
    }

    cargarReporte();
</script>
