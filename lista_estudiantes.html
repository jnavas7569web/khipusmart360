<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KhipuSmart360 - Nómina</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --azul: #5c6bc0; --naranja: #ffb74d; --gris-fondo: #f4f7f6; --blanco: #ffffff; --rojo: #ef5350; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--gris-fondo); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 1000px; width: 100%; background: var(--blanco); padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .table-responsive { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; text-transform: capitalize; }
        th { background: #f8f9fa; color: var(--azul); font-size: 0.8rem; text-transform: uppercase; }
        .nee-si { background: var(--rojo); color: white; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 0.7rem; }
        .btn { border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .btn-cargar { background: var(--naranja); color: white; margin: 0 auto; }
        .btn-nuevo { background: var(--azul); color: white; margin: 20px auto; }
        .btn-delete { background: var(--rojo); color: white; padding: 5px 10px; font-size: 0.8rem; }
        #student-list-section { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2><i class="fa-solid fa-users-viewfinder"></i> Mi Nómina</h2>
        <a href="dashboard.html" style="text-decoration:none; color:#888;"><i class="fa-solid fa-arrow-left"></i> Volver</a>
    </div>



<!-- ----------------para filtarrrr -->
<div class="grid-2" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; background: #f9f9f9; padding: 15px; border-radius: 10px; border: 1px solid #eee;">
    <div class="form-group">
        <label style="display: block; font-size: 0.8rem; font-weight: bold; color: var(--azul); margin-bottom: 5px;">
            <i class="fa-solid fa-graduation-cap"></i> SELECCIONE GRADO:
        </label>
        <select id="select-grado-filtro" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc;">
            <option value="">Cargando grados...</option>
        </select>
    </div>
    <div class="form-group">
        <label style="display: block; font-size: 0.8rem; font-weight: bold; color: var(--azul); margin-bottom: 5px;">
            <i class="fa-solid fa-chalkboard-user"></i> PARALELO:
        </label>
        <select id="select-paralelo-filtro" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc;">
            <option value="">Cargando...</option>
        </select>
    </div>
</div>

<!-- ------------------------------------------ -->


    
    
    <button id="btn-cargar" class="btn btn-cargar"><i class="fa-solid fa-sync" id="icon-sync"></i> CARGAR ESTUDIANTES</button>

    <div id="student-list-section">
        <h3 id="course-title" style="margin-top:20px; color:#555;">Estudiantes Registrados</h3>
        
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Apellidos y Nombres</th>
                        <th>Cédula</th>
                        <th>Edad</th>
                        <th>NEE</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="lista-cuerpo"></tbody>
            </table>
        </div>

        <button onclick="window.location.href='estudiantes.html'" class="btn btn-nuevo">
            <i class="fa-solid fa-user-plus"></i> AÑADIR NUEVO ESTUDIANTE
        </button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, query, where, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBsEeL_xG-koVvHWpTot5f1PeqNQo-eN8o",
        authDomain: "khipusmart360.firebaseapp.com",
        projectId: "khipusmart360",
        storageBucket: "khipusmart360.firebasestorage.app",
        messagingSenderId: "240593523716",
        appId: "1:240593523716:web:03cbfe1f8f41f1b2a75151"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let docenteId = "";

    // 1. CARGAR SELECTORES AL INICIAR
    async function cargarFiltros() {
        const sGrado = document.getElementById('select-grado-filtro');
        const sParalelo = document.getElementById('select-paralelo-filtro');

        try {
            const snapGrados = await getDocs(collection(db, "grados"));
            sGrado.innerHTML = '<option value="">-- Seleccionar Grado --</option>';
            snapGrados.forEach(d => {
                sGrado.innerHTML += `<option value="${d.id}">${d.data().nombre || d.id}</option>`;
            });

            const snapParalelos = await getDocs(collection(db, "paralelos"));
            sParalelo.innerHTML = '<option value="">-- Seleccionar Paralelo --</option>';
            snapParalelos.forEach(d => {
                const p = d.data().nombre || d.id;
                sParalelo.innerHTML += `<option value="${p}">${p}</option>`;
            });
        } catch (e) { console.error("Error cargando filtros:", e); }
    }

    onAuthStateChanged(auth, (user) => {
        if (user) { 
            docenteId = user.uid; 
            cargarFiltros(); 
        } else { window.location.href = "index.html"; }
    });

    function calcularEdad(fechaStr) {
        if(!fechaStr) return "N/D";
        const hoy = new Date();
        const cumple = new Date(fechaStr);
        let edad = hoy.getFullYear() - cumple.getFullYear();
        if (hoy.getMonth() < cumple.getMonth() || (hoy.getMonth() == cumple.getMonth() && hoy.getDate() < cumple.getDate())) edad--;
        return isNaN(edad) ? "Error" : edad;
    }

    // 2. BOTÓN CARGAR CON FILTROS
    document.getElementById('btn-cargar').addEventListener('click', async () => {
        const gradoId = document.getElementById('select-grado-filtro').value;
        const paraleloId = document.getElementById('select-paralelo-filtro').value;

        if (!gradoId || !paraleloId) {
            alert("⚠️ Por favor, selecciona Grado y Paralelo antes de cargar.");
            return;
        }

        const cuerpo = document.getElementById('lista-cuerpo');
        const icon = document.getElementById('icon-sync');
        
        icon.classList.add('fa-spin');
        cuerpo.innerHTML = "<tr><td colspan='5' style='text-align:center;'>Filtrando estudiantes...</td></tr>";
        document.getElementById('student-list-section').style.display = "block";

        try {
            const q = query(
                collection(db, "estudiantes"), 
                where("id_docente", "==", docenteId),
                where("id_grado", "==", gradoId),
                where("id_paralelo", "==", paraleloId)
            );

            const snapshot = await getDocs(q);
            cuerpo.innerHTML = "";
            icon.classList.remove('fa-spin');

            if (snapshot.empty) {
                cuerpo.innerHTML = "<tr><td colspan='5' style='text-align:center;'>No hay estudiantes en este curso.</td></tr>";
                return;
            }

            let lista = [];
            snapshot.forEach(d => lista.push({ id: d.id, ...d.data() }));
            lista.sort((a, b) => a.apellidos.localeCompare(b.apellidos));

            lista.forEach((est) => {
                const fila = document.createElement('tr');
                fila.style.cursor = "pointer";
                fila.innerHTML = `
                    <td style="font-weight: 500;">
                        <i class="fa-solid fa-pen-to-square" style="color: #ccc; margin-right: 8px;"></i>
                        ${est.apellidos} ${est.nombres}
                    </td>
                    <td>${est.cedula}</td>
                    <td>${calcularEdad(est.fecha_nacimiento)} años</td>
                    <td>${est.estudiante_NEE === 'si' ? '<span class="nee-si">SÍ</span>' : 'NO'}</td>
                    <td>
                        <button class="btn btn-delete" data-id="${est.id}"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;

                // Evento para Editar
                fila.addEventListener('click', (e) => {
                    if (e.target.closest('.btn-delete')) return;
                    window.location.href = `estudiantes.html?edit=${est.id}`;
                });

                cuerpo.appendChild(fila);
            });

            // Lógica para Borrar
            document.querySelectorAll('.btn-delete').forEach(btn => {
                btn.onclick = async (e) => {
                    e.stopPropagation();
                    const id = btn.getAttribute('data-id');
                    if(confirm("¿Seguro que deseas eliminar este estudiante?")) {
                        await deleteDoc(doc(db, "estudiantes", id));
                        btn.closest('tr').remove();
                    }
                };
            });

        } catch (error) {
            console.error(error);
            cuerpo.innerHTML = "<tr><td colspan='5' style='color:red;'>Error al cargar datos.</td></tr>";
            icon.classList.remove('fa-spin');
        }
    });
</script>
</body>
</html>
