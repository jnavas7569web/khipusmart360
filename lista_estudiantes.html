<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KhipuSmart360 - Control Global de Estudiantes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --azul-admin: #1a237e; --gris-fondo: #f4f7f6; }
        body { background-color: var(--gris-fondo); font-family: 'Segoe UI', sans-serif; }
        .header-admin { background: linear-gradient(135deg, #1a237e 0%, #3949ab 100%); }
        .badge-docente { background: #e8eaf6; color: #3f51b5; border: 1px solid #c5cae9; }
        /* Forzar color negro en toda la tabla */
        .texto-matriz { color: #1a1a1a !important; font-weight: 600; }
    </style>
</head>
<body class="p-4 md:p-8">

<div class="max-w-[95%] mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden">
    <div class="header-admin p-6 text-white flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-black tracking-tight"><i class="fa-solid fa-shield-halved mr-2"></i>Panel de Control Estudiantil</h1>
            <p class="text-indigo-100 text-xs opacity-80 uppercase tracking-widest font-bold">Acceso Nivel: Administrador</p>
        </div>
        <button onclick="window.location.href='estudiantes.html'" class="bg-white text-indigo-900 px-6 py-3 rounded-xl font-bold text-sm hover:bg-indigo-50 shadow-lg transition-all transform hover:scale-105">
            <i class="fa-solid fa-user-plus mr-2"></i> NUEVO ESTUDIANTE
        </button>
    </div>

    <div class="p-6 bg-gray-50 border-b border-gray-100">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
            <div>
                <label class="block text-[10px] font-black text-gray-500 mb-2 uppercase tracking-widest">1. Periodo Lectivo:</label>
                <select id="select-periodo" class="w-full p-3 rounded-xl border-2 border-gray-200 outline-none focus:border-indigo-500 text-sm font-bold bg-white">
                    <option value="">Cargando...</option>
                </select>
            </div>
            <div>
                <label class="block text-[10px] font-black text-gray-500 mb-2 uppercase tracking-widest">2. Grado / Año:</label>
                <select id="select-grado" class="w-full p-3 rounded-xl border-2 border-gray-200 outline-none focus:border-indigo-500 text-sm bg-white">
                    <option value="">Seleccione Periodo...</option>
                </select>
            </div>
            <div>
                <label class="block text-[10px] font-black text-gray-500 mb-2 uppercase tracking-widest">3. Paralelo:</label>
                <select id="select-paralelo" class="w-full p-3 rounded-xl border-2 border-gray-200 outline-none focus:border-indigo-500 text-sm bg-white">
                    <option value="">Seleccione Grado...</option>
                </select>
            </div>
            <button id="btn-buscar" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl transition-all shadow-md flex items-center justify-center gap-2 uppercase text-xs tracking-widest">
                <i class="fa-solid fa-magnifying-glass"></i> Consultar Nómina
            </button>
        </div>

        <div id="container-docentes" class="mt-6 p-4 bg-indigo-50 rounded-2xl hidden border border-indigo-100 shadow-inner">
            <span class="text-[10px] font-black text-indigo-400 uppercase block mb-2 tracking-tighter">Personal Docente Asignado a este Curso:</span>
            <div id="lista-docentes" class="flex flex-wrap gap-2"></div>
        </div>
    </div>

    <div class="p-6">
        <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
                <thead>
                    <tr class="text-indigo-900 border-b-2 border-indigo-50">
                        <th class="px-2 py-4 uppercase font-black tracking-tight">Apellidos y Nombres</th>
                        <th class="px-2 py-4 uppercase font-black tracking-tight text-center">Cédula</th>
                        <th class="px-2 py-4 uppercase font-black tracking-tight text-center">Edad</th>
                        <th class="px-2 py-4 uppercase font-black tracking-tight">Representante</th>
                        <th class="px-2 py-4 uppercase font-black tracking-tight text-center">Teléfono</th>
                        <th class="px-2 py-4 uppercase font-black tracking-tight">Dirección</th>
                        <th class="px-2 py-4 uppercase font-black tracking-tight text-center">NEE</th>
                        <th class="px-2 py-4 uppercase font-black tracking-tight text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-body" class="divide-y divide-gray-100">
                    <tr>
                        <td colspan="8" class="text-center py-20 text-gray-400 italic font-medium text-sm">Use los filtros superiores para generar la lista de estudiantes.</td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div class="mt-8 flex justify-between items-center border-t pt-6">
            <a href="dashboard.html" class="text-gray-500 hover:text-indigo-600 font-bold text-sm transition-all flex items-center">
                <i class="fa-solid fa-arrow-left-long mr-2"></i> Volver al Dashboard
            </a>
            <div id="contador" class="bg-indigo-900 px-6 py-2 rounded-xl text-[10px] font-black text-white uppercase tracking-widest shadow-md">Estudiantes: 0</div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, where, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
//// botarlos si escriben la url
    onAuthStateChanged(auth, async (user) => {
    if (user) {
        // CAPA DE SEGURIDAD: Verificar rol antes de mostrar nada
        const docRef = doc(db, "usuarios", user.uid);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
            const d = docSnap.data();
            const isAdmin = (d.rol === 'admin' || d.rol === 'superadmin');

            if (!isAdmin) {
                // Si NO es admin, lo sacamos volando de aquí
                Swal.fire({
                    icon: 'error',
                    title: 'Acceso Denegado',
                    text: 'No tienes permisos para acceder a la Gestión Global.',
                    timer: 3000,
                    showConfirmButton: false
                }).then(() => {
                    window.location.href = "dashboard.html";
                });
                return; // Detenemos la ejecución del resto del script
            }
            
            // Si es Admin, el código de la página sigue normal...
            init(); 
        }
    } else {
        window.location.href = "index.html";
    }
});
    ////////////////// hasta aqaui
    const firebaseConfig = {
        apiKey: "AIzaSyBsEeL_xG-koVvHWpTot5f1PeqNQo-eN8o",
        authDomain: "khipusmart360.firebaseapp.com",
        projectId: "khipusmart360",
        storageBucket: "khipusmart360.firebasestorage.app",
        messagingSenderId: "240593523716",
        appId: "1:240593523716:web:03cbfe1f8f41f1b2a75151"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let dbUsuarios = {}; 

    async function init() {
        const snapUsers = await getDocs(collection(db, "usuarios"));
        snapUsers.forEach(u => dbUsuarios[u.id] = u.data().nombre_completo);

        const snapAsig = await getDocs(collection(db, "asignaciones"));
        const selectP = document.getElementById('select-periodo');
        let periodos = new Set();
        snapAsig.forEach(d => periodos.add(d.data().periodo));
        
        selectP.innerHTML = '<option value="">Periodo...</option>';
        Array.from(periodos).sort().reverse().forEach(p => {
            selectP.innerHTML += `<option value="${p}">${p}</option>`;
        });
    }

    document.getElementById('select-periodo').addEventListener('change', async (e) => {
        const p = e.target.value;
        const snap = await getDocs(query(collection(db, "asignaciones"), where("periodo", "==", p)));
        let grados = new Set();
        snap.forEach(d => grados.add(d.data().id_grado));
        const sG = document.getElementById('select-grado');
        sG.innerHTML = '<option value="">Grado...</option>';
        grados.forEach(g => sG.innerHTML += `<option value="${g}">${g}</option>`);
    });

    document.getElementById('select-grado').addEventListener('change', async (e) => {
        const g = e.target.value;
        const p = document.getElementById('select-periodo').value;
        const snap = await getDocs(query(collection(db, "asignaciones"), where("periodo", "==", p), where("id_grado", "==", g)));
        let paras = new Set();
        snap.forEach(d => paras.add(d.data().id_paralelo));
        const sP = document.getElementById('select-paralelo');
        sP.innerHTML = '<option value="">Paralelo...</option>';
        paras.forEach(pa => sP.innerHTML += `<option value="${pa}">${pa}</option>`);
    });

    function calcularEdad(f) {
        if(!f) return "---";
        const hoy = new Date();
        const cumple = new Date(f);
        let edad = hoy.getFullYear() - cumple.getFullYear();
        if (hoy.getMonth() < cumple.getMonth() || (hoy.getMonth() === cumple.getMonth() && hoy.getDate() < cumple.getDate())) edad--;
        return edad + " años";
    }

    document.getElementById('btn-buscar').addEventListener('click', async () => {
        const periodo = document.getElementById('select-periodo').value;
        const grado = document.getElementById('select-grado').value;
        const paralelo = document.getElementById('select-paralelo').value;
        const tbody = document.getElementById('tabla-body');

        if(!paralelo) return Swal.fire('Faltan Filtros', 'Seleccione Periodo, Grado y Paralelo', 'info');

        tbody.innerHTML = '<tr><td colspan="8" class="text-center py-20 text-indigo-600 font-black animate-pulse">GENERANDO MATRIZ...</td></tr>';

        const qDoc = query(collection(db, "asignaciones"), where("periodo", "==", periodo), where("id_grado", "==", grado), where("id_paralelo", "==", paralelo));
        const snapDoc = await getDocs(qDoc);
        const contDoc = document.getElementById('container-docentes');
        const listDoc = document.getElementById('lista-docentes');
        listDoc.innerHTML = "";
        
        if(!snapDoc.empty) {
            contDoc.classList.remove('hidden');
            snapDoc.forEach(d => {
                const nombre = dbUsuarios[d.data().id_docente] || "Desconocido";
                const materia = d.data().id_materia || "Docencia";
                listDoc.innerHTML += `<span class="badge-docente px-3 py-1 rounded-lg text-[10px] font-black uppercase"><i class="fa-solid fa-user-tie mr-1"></i> ${nombre} | <span class="opacity-60">${materia}</span></span>`;
            });
        }

        const qEst = query(collection(db, "estudiantes"), where("id_grado", "==", grado), where("id_paralelo", "==", paralelo));
        const snapEst = await getDocs(qEst);
        let estudiantes = [];
        snapEst.forEach(d => estudiantes.push({ id: d.id, ...d.data() }));

        estudiantes.sort((a,b) => (a.apellidos || "").localeCompare(b.apellidos || ""));

        tbody.innerHTML = "";
        estudiantes.forEach(e => {
            const tr = document.createElement('tr');
            tr.className = "hover:bg-indigo-50 transition-all border-b border-gray-100 texto-matriz";
            tr.innerHTML = `
                <td class="px-2 py-4 font-black text-indigo-900 uppercase tracking-tight">${e.apellidos} ${e.nombres}</td>
                <td class="px-2 py-4 text-center font-mono">${e.cedula || '---'}</td>
                <td class="px-2 py-4 text-center">${calcularEdad(e.fecha_nacimiento)}</td>
                <td class="px-2 py-4">${e.nombre_repre || '---'}</td>
                <td class="px-2 py-4 text-center text-green-700">
                    ${e.telefono_repre ? `<i class="fa-brands fa-whatsapp mr-1"></i>${e.telefono_repre}` : '---'}
                </td>
                <td class="px-2 py-4 italic text-[10px]">${e.direccion || '---'}</td>
                <td class="px-2 py-4 text-center">
                    <span class="px-2 py-1 rounded-md ${e.nee === 'SI' ? 'bg-red-600 text-white' : 'bg-gray-100 text-gray-400 opacity-30'}">${e.nee || 'NO'}</span>
                </td>
                <td class="px-2 py-4 text-center">
                    <div class="flex justify-center gap-3">
                        <button onclick="window.location.href='estudiantes.html?id=${e.id}'" class="text-indigo-600 hover:scale-125 transition-all"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button onclick="eliminarEst('${e.id}', '${e.apellidos}')" class="text-red-500 hover:scale-125 transition-all"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });
        document.getElementById('contador').innerText = `Estudiantes: ${estudiantes.length}`;
    });

    window.eliminarEst = (id, nombre) => {
        Swal.fire({
            title: `¿Eliminar a ${nombre}?`,
            text: "Esta acción removerá al estudiante de la base de datos.",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#ef4444',
            confirmButtonText: 'Eliminar Registro'
        }).then(async (result) => {
            if (result.isConfirmed) {
                await deleteDoc(doc(db, "estudiantes", id));
                Swal.fire('Eliminado', 'Registro removido con éxito.', 'success');
                document.getElementById('btn-buscar').click();
            }
        });
    }

    init();
</script>
</body>
</html>
