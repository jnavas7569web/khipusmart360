<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KhipuSmart360 - Control Global de Estudiantes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --azul-admin: #1a237e; --gris-fondo: #f4f7f6; }
        body { background-color: var(--gris-fondo); font-family: 'Segoe UI', sans-serif; }
        .header-admin { background: linear-gradient(135deg, #1a237e 0%, #3949ab 100%); }
        .badge-docente { background: #e8eaf6; color: #3f51b5; border: 1px solid #c5cae9; }
    </style>
</head>
<body class="p-4 md:p-8">

<div class="max-w-7xl mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden">
    <div class="header-admin p-6 text-white flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-black tracking-tight"><i class="fa-solid fa-shield-halved mr-2"></i>Panel de Control Estudiantil</h1>
            <p class="text-indigo-100 text-xs opacity-80 uppercase tracking-widest font-bold">Acceso Nivel: Administrador</p>
        </div>
        <button onclick="window.location.href='registro_estudiante.html'" class="bg-white text-indigo-900 px-4 py-2 rounded-xl font-bold text-sm hover:bg-indigo-50 transition-all">
            <i class="fa-solid fa-plus mr-1"></i> NUEVO ESTUDIANTE
        </button>
    </div>

    <div class="p-6 bg-gray-50 border-b border-gray-100">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
            <div>
                <label class="block text-[10px] font-black text-gray-400 mb-2 uppercase">1. Periodo:</label>
                <select id="select-periodo" class="w-full p-3 rounded-xl border-2 border-gray-200 outline-none focus:border-indigo-500 text-sm font-bold">
                    <option value="">Cargando...</option>
                </select>
            </div>
            <div>
                <label class="block text-[10px] font-black text-gray-400 mb-2 uppercase">2. Grado:</label>
                <select id="select-grado" class="w-full p-3 rounded-xl border-2 border-gray-200 outline-none focus:border-indigo-500 text-sm">
                    <option value="">Seleccione Periodo...</option>
                </select>
            </div>
            <div>
                <label class="block text-[10px] font-black text-gray-400 mb-2 uppercase">3. Paralelo:</label>
                <select id="select-paralelo" class="w-full p-3 rounded-xl border-2 border-gray-200 outline-none focus:border-indigo-500 text-sm">
                    <option value="">Seleccione Grado...</option>
                </select>
            </div>
            <button id="btn-buscar" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-magnifying-glass"></i> CONSULTAR
            </button>
        </div>

        <div id="container-docentes" class="mt-6 p-4 bg-indigo-50 rounded-2xl hidden border border-indigo-100">
            <span class="text-[10px] font-black text-indigo-400 uppercase block mb-2">Docentes Vinculados a este Curso:</span>
            <div id="lista-docentes" class="flex flex-wrap gap-2">
                </div>
        </div>
    </div>

    <div class="p-6">
        <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
                <thead>
                    <tr class="text-gray-400 border-b border-gray-100">
                        <th class="px-2 py-4 uppercase font-black tracking-tighter">Apellidos y Nombres</th>
                        <th class="px-2 py-4 uppercase font-black tracking-tighter text-center">Cédula</th>
                        <th class="px-2 py-4 uppercase font-black tracking-tighter text-center">Edad</th>
                        <th class="px-2 py-4 uppercase font-black tracking-tighter">Representante / Telf.</th>
                        <th class="px-2 py-4 uppercase font-black tracking-tighter">Dirección</th>
                        <th class="px-2 py-4 uppercase font-black tracking-tighter text-center">NEE</th>
                        <th class="px-2 py-4 uppercase font-black tracking-tighter text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-body" class="divide-y divide-gray-50">
                    <tr>
                        <td colspan="7" class="text-center py-20 text-gray-300 italic">Aplique los filtros para generar la nómina.</td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div class="mt-8 flex justify-between items-center border-t pt-6">
            <a href="dashboard.html" class="text-gray-400 hover:text-indigo-600 font-bold text-sm transition-all">
                <i class="fa-solid fa-arrow-left mr-2"></i> Panel Principal
            </a>
            <div id="contador" class="bg-gray-100 px-4 py-1 rounded-full text-[10px] font-black text-gray-500 uppercase">Estudiantes: 0</div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, where, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBsEeL_xG-koVvHWpTot5f1PeqNQo-eN8o",
        authDomain: "khipusmart360.firebaseapp.com",
        projectId: "khipusmart360",
        storageBucket: "khipusmart360.firebasestorage.app",
        messagingSenderId: "240593523716",
        appId: "1:240593523716:web:03cbfe1f8f41f1b2a75151"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let dbUsuarios = {}; // Para traducir IDs de docentes a nombres

    // 1. CARGA INICIAL: Periodos y Usuarios
    async function init() {
        // Cargar usuarios para saber los nombres de los profes
        const snapUsers = await getDocs(collection(db, "usuarios"));
        snapUsers.forEach(u => dbUsuarios[u.id] = u.data().nombre_completo);

        // Cargar Periodos únicos de la tabla asignaciones
        const snapAsig = await getDocs(collection(db, "asignaciones"));
        const selectP = document.getElementById('select-periodo');
        let periodos = new Set();
        
        snapAsig.forEach(d => periodos.add(d.data().periodo));
        
        selectP.innerHTML = '<option value="">Periodo...</option>';
        Array.from(periodos).sort().reverse().forEach(p => {
            selectP.innerHTML += `<option value="${p}">${p}</option>`;
        });
    }

    // Filtros dinámicos de Grado y Paralelo
    document.getElementById('select-periodo').addEventListener('change', async (e) => {
        const p = e.target.value;
        const snap = await getDocs(query(collection(db, "asignaciones"), where("periodo", "==", p)));
        let grados = new Set();
        snap.forEach(d => grados.add(d.data().id_grado));
        
        const sG = document.getElementById('select-grado');
        sG.innerHTML = '<option value="">Grado...</option>';
        grados.forEach(g => sG.innerHTML += `<option value="${g}">${g}</option>`);
    });

    document.getElementById('select-grado').addEventListener('change', async (e) => {
        const g = e.target.value;
        const p = document.getElementById('select-periodo').value;
        const snap = await getDocs(query(collection(db, "asignaciones"), where("periodo", "==", p), where("id_grado", "==", g)));
        let paras = new Set();
        snap.forEach(d => paras.add(d.data().id_paralelo));
        
        const sP = document.getElementById('select-paralelo');
        sP.innerHTML = '<option value="">Paralelo...</option>';
        paras.forEach(pa => sP.innerHTML += `<option value="${pa}">${pa}</option>`);
    });

    // Función Edad
    function calcularEdad(f) {
        if(!f) return "---";
        const hoy = new Date();
        const cumple = new Date(f);
        let edad = hoy.getFullYear() - cumple.getFullYear();
        if (hoy.getMonth() < cumple.getMonth() || (hoy.getMonth() === cumple.getMonth() && hoy.getDate() < cumple.getDate())) edad--;
        return edad;
    }

    // BOTÓN BUSCAR
    document.getElementById('btn-buscar').addEventListener('click', async () => {
        const periodo = document.getElementById('select-periodo').value;
        const grado = document.getElementById('select-grado').value;
        const paralelo = document.getElementById('select-paralelo').value;
        const tbody = document.getElementById('tabla-body');

        if(!paralelo) return Swal.fire('Error', 'Complete los filtros', 'error');

        tbody.innerHTML = '<tr><td colspan="7" class="text-center py-20 text-indigo-600 font-bold">Procesando información...</td></tr>';

        // 1. Mostrar Docentes Asignados
        const qDoc = query(collection(db, "asignaciones"), where("periodo", "==", periodo), where("id_grado", "==", grado), where("id_paralelo", "==", paralelo));
        const snapDoc = await getDocs(qDoc);
        const contDoc = document.getElementById('container-docentes');
        const listDoc = document.getElementById('lista-docentes');
        listDoc.innerHTML = "";
        
        if(!snapDoc.empty) {
            contDoc.classList.remove('hidden');
            snapDoc.forEach(d => {
                const nombre = dbUsuarios[d.data().id_docente] || "Desconocido";
                const materia = d.data().id_materia || "General";
                listDoc.innerHTML += `<span class="badge-docente px-3 py-1 rounded-lg text-[10px] font-bold">
                    <i class="fa-solid fa-chalkboard-user mr-1"></i> ${nombre} (${materia})
                </span>`;
            });
        }

        // 2. Cargar Estudiantes (Sin OrderBy para evitar error de índice)
        const qEst = query(collection(db, "estudiantes"), where("id_grado", "==", grado), where("id_paralelo", "==", paralelo));
        const snapEst = await getDocs(qEst);
        
        let estudiantes = [];
        snapEst.forEach(d => estudiantes.push({ id: d.id, ...d.data() }));

        // ORDENAMIENTO EN JAVA PARA EVITAR ERROR DE ÍNDICE
        estudiantes.sort((a,b) => (a.apellidos || "").localeCompare(b.apellidos || ""));

        tbody.innerHTML = "";
        estudiantes.forEach(e => {
            const tr = document.createElement('tr');
            tr.className = "hover:bg-gray-50 transition-all";
            tr.innerHTML = `
                <td class="px-2 py-4">
                    <div class="font-bold text-indigo-900 uppercase">${e.apellidos} ${e.nombres}</div>
                </td>
                <td class="px-2 py-4 text-center font-mono text-gray-400">${e.cedula || '---'}</td>
                <td class="px-2 py-4 text-center text-gray-600">${calcularEdad(e.fecha_nacimiento)} años</td>
                <td class="px-2 py-4">
                    <div class="font-bold text-gray-700">${e.nombre_repre || '---'}</div>
                    <div class="text-[10px] text-green-600 font-bold"><i class="fa-brands fa-whatsapp"></i> ${e.telefono_repre || '---'}</div>
                </td>
                <td class="px-2 py-4 text-gray-500 italic text-[10px]">${e.direccion || 'No registrada'}</td>
                <td class="px-2 py-4 text-center">
                    <span class="px-2 py-1 rounded-md font-black ${e.nee === 'SI' ? 'bg-red-100 text-red-600' : 'bg-gray-100 text-gray-300'}">${e.nee || 'NO'}</span>
                </td>
                <td class="px-2 py-4 text-center">
                    <div class="flex justify-center gap-2">
                        <button onclick="window.location.href='registro_estudiante.html?id=${e.id}'" class="text-indigo-600 hover:bg-indigo-100 p-2 rounded-lg transition-all"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="eliminarEst('${e.id}', '${e.apellidos}')" class="text-red-500 hover:bg-red-100 p-2 rounded-lg transition-all"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });
        document.getElementById('contador').innerText = `Estudiantes: ${estudiantes.length}`;
    });

    // FUNCIÓN ELIMINAR
    window.eliminarEst = (id, nombre) => {
        Swal.fire({
            title: `¿Eliminar a ${nombre}?`,
            text: "Esta acción no se puede deshacer.",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#ef5350',
            confirmButtonText: 'Sí, eliminar'
        }).then(async (result) => {
            if (result.isConfirmed) {
                await deleteDoc(doc(db, "estudiantes", id));
                Swal.fire('Eliminado', 'El estudiante ha sido removido.', 'success');
                document.getElementById('btn-buscar').click();
            }
        });
    }

    init();
</script>
</body>
</html>
