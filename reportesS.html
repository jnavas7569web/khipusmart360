<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KhipuSmart360 - Centro de Reportes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --azul: #5c6bc0; --naranja: #ffb74d; --celeste: #4dd0e1; --morado: #ba68c8; --gris-fondo: #f4f7f6; }
        body { background-color: var(--gris-fondo); font-family: 'Segoe UI', sans-serif; }
        .card-header { background: linear-gradient(135deg, #1a237e 0%, var(--azul) 100%); }
        .btn-reporte { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .btn-reporte:hover { transform: translateY(-5px); filter: brightness(1.1); }
        .filtro-seccion { display: none; animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="p-4 md:p-8">

<div class="max-w-5xl mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-100">
    <div class="card-header p-8 text-white text-center">
        <h1 class="text-3xl font-black tracking-tighter uppercase"><i class="fa-solid fa-chart-pie mr-3"></i>Centro de Reportes</h1>
        <p class="text-indigo-100 text-sm opacity-80 mt-2">Seleccione el tipo de informe que desea generar para este periodo.</p>
    </div>

    <div id="seleccion-inicial" class="p-10 grid grid-cols-1 md:grid-cols-2 gap-8">
        <div onclick="mostrarFiltros('notas')" class="btn-reporte p-8 rounded-2xl text-white text-center shadow-xl" style="background-color: var(--celeste);">
            <i class="fa-solid fa-file-signature text-5xl mb-4"></i>
            <h2 class="text-xl font-black uppercase tracking-widest">Reporte de Notas</h2>
            <p class="text-xs opacity-80 mt-2 font-medium italic">Consolidado de calificaciones por materia y curso.</p>
        </div>

        <div onclick="mostrarFiltros('asistencias')" class="btn-reporte p-8 rounded-2xl text-white text-center shadow-xl" style="background-color: var(--morado);">
            <i class="fa-solid fa-calendar-check text-5xl mb-4"></i>
            <h2 class="text-xl font-black uppercase tracking-widest">Reporte Asistencias</h2>
            <p class="text-xs opacity-80 mt-2 font-medium italic">Historial de faltas, atrasos y justificaciones.</p>
        </div>
    </div>

    <div id="seccion-filtros" class="filtro-seccion p-8 bg-gray-50 border-t border-gray-100">
        <h3 id="titulo-filtro" class="text-indigo-900 font-black text-center mb-6 uppercase tracking-widest border-b pb-2 italic">Configurar Filtros</h3>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div>
                <label class="block text-[10px] font-black text-gray-400 mb-2 uppercase tracking-widest">Periodo Lectivo:</label>
                <div class="p-3 bg-white border-2 border-gray-200 rounded-xl font-bold text-gray-700">2026-2027</div>
            </div>

            <div>
                <label class="block text-[10px] font-black text-gray-400 mb-2 uppercase tracking-widest">Grado / Paralelo:</label>
                <select id="select-curso" class="w-full p-3 bg-white border-2 border-gray-200 rounded-xl font-bold text-gray-700 outline-none focus:border-indigo-400">
                    <option value="">Cargando cursos...</option>
                </select>
            </div>

            <div id="opcion-variable"></div>
        </div>

        <div class="mt-10 flex justify-center gap-4">
            <button onclick="window.location.reload()" class="px-8 py-3 bg-gray-400 text-white font-black rounded-xl text-xs uppercase tracking-widest hover:bg-gray-500 transition-all">
                <i class="fa-solid fa-rotate-left mr-2"></i> Cambiar Reporte
            </button>
            <button id="btn-generar" class="px-10 py-3 bg-indigo-600 text-white font-black rounded-xl text-xs uppercase tracking-widest hover:bg-indigo-800 shadow-lg shadow-indigo-100 transition-all transform active:scale-95">
                <i class="fa-solid fa-file-pdf mr-2"></i> Generar Informe
            </button>
        </div>
    </div>

    <div class="p-6 bg-gray-100 flex justify-center">
        <a href="dashboard.html" class="text-gray-400 hover:text-indigo-600 font-bold text-xs uppercase tracking-widest transition-all">
            <i class="fa-solid fa-arrow-left mr-2"></i> Regresar al Menú Principal
        </a>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBsEeL_xG-koVvHWpTot5f1PeqNQo-eN8o",
        authDomain: "khipusmart360.firebaseapp.com",
        projectId: "khipusmart360",
        storageBucket: "khipusmart360.firebasestorage.app",
        messagingSenderId: "240593523716",
        appId: "1:240593523716:web:03cbfe1f8f41f1b2a75151"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let uidDocente = "";
    let tipoReporte = "";

    // CARGAR CURSOS ASIGNADOS
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            uidDocente = user.uid;
            const qAsig = query(collection(db, "asignaciones"), where("id_docente", "==", user.uid));
            const snapAsig = await getDocs(qAsig);
            const selectCurso = document.getElementById('select-curso');
            selectCurso.innerHTML = '<option value="">Seleccione Curso...</option>';
            snapAsig.forEach(doc => {
                const d = doc.data();
                const valor = `${d.id_grado}-${d.id_paralelo}`;
                selectCurso.innerHTML += `<option value="${valor}">${d.id_grado} - ${d.id_paralelo}</option>`;
            });
        } else { window.location.href = "index.html"; }
    });

    // FUNCIÓN PARA MOSTRAR FILTROS SEGÚN ELECCIÓN
    window.mostrarFiltros = function(tipo) {
        tipoReporte = tipo;
        document.getElementById('seleccion-inicial').style.display = 'none';
        document.getElementById('seccion-filtros').style.display = 'block';
        
        const variableCont = document.getElementById('opcion-variable');
        const titulo = document.getElementById('titulo-filtro');

        if (tipo === 'notas') {
            titulo.innerText = "Filtros Reporte de Notas";
            variableCont.innerHTML = `
                <label class="block text-[10px] font-black text-gray-400 mb-2 uppercase tracking-widest">Materia:</label>
                <select id="select-materia" class="w-full p-3 bg-white border-2 border-gray-200 rounded-xl font-bold text-gray-700 outline-none focus:border-indigo-400">
                    <option value="all">Todas las materias</option>
                </select>
            `;
            cargarMaterias();
        } else if (tipo === 'asistencias') {
            titulo.innerText = "Filtros Reporte de Asistencia";
            variableCont.innerHTML = `
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-black text-gray-400 mb-2 uppercase tracking-widest">Desde:</label>
                        <input type="date" id="fecha-inicio" class="w-full p-2.5 bg-white border-2 border-gray-200 rounded-xl font-bold text-gray-700 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-gray-400 mb-2 uppercase tracking-widest">Hasta:</label>
                        <input type="date" id="fecha-fin" class="w-full p-2.5 bg-white border-2 border-gray-200 rounded-xl font-bold text-gray-700 outline-none">
                    </div>
                </div>
            `;
            // Por defecto: desde el 1 del mes actual hasta hoy
            const hoy = new Date();
            const inicioMes = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
            document.getElementById('fecha-inicio').valueAsDate = inicioMes;
            document.getElementById('fecha-fin').valueAsDate = hoy;
        }
    };

    async function cargarMaterias() {
        const snapMat = await getDocs(collection(db, "materias"));
        const selMat = document.getElementById('select-materia');
        snapMat.forEach(doc => {
            selMat.innerHTML += `<option value="${doc.id}">${doc.data().nombre || doc.id}</option>`;
        });
    }

    document.getElementById('btn-generar').addEventListener('click', () => {
        const curso = document.getElementById('select-curso').value;
        if(!curso) return Swal.fire('Error', 'Debe seleccionar un curso.', 'error');

        if(tipoReporte === 'notas') {
            window.location.href = `reporte_notas.html?curso=${curso}`;
        } else if(tipoReporte === 'asistencias') {
            const desde = document.getElementById('fecha-inicio').value;
            const hasta = document.getElementById('fecha-fin').value;
            window.location.href = `reporte_asistencias.html?curso=${curso}&desde=${desde}&hasta=${hasta}`;
        }
    });
</script>
</body>
</html>
