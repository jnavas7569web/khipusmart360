<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KhipuSmart360 - Mis Listas Asignadas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --azul: #5c6bc0; --naranja: #ffb74d; --gris-fondo: #f4f7f6; }
        body { background-color: var(--gris-fondo); font-family: 'Segoe UI', sans-serif; }
        .card-header { background: linear-gradient(135deg, var(--azul) 0%, #3f51b5 100%); }
    </style>
</head>
<body class="p-4 md:p-8">

<div class="max-w-5xl mx-auto bg-white rounded-3xl shadow-xl overflow-hidden">
    <div class="card-header p-6 text-white flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-black tracking-tight"><i class="fa-solid fa-clipboard-list mr-2"></i>Mi Nómina</h1>
            <p class="text-indigo-100 text-sm opacity-80" id="info-docente">Cargando datos del docente...</p>
        </div>
        <div class="bg-white/20 px-4 py-2 rounded-xl backdrop-blur-sm border border-white/30 text-center">
            <span class="text-xs uppercase font-bold block opacity-70">Periodo Lectivo</span>
            <span class="font-mono font-bold" id="periodo-actual">2026-2027</span>
        </div>
    </div>

    <div class="p-6 bg-gray-50 border-b border-gray-100">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
            <div>
                <label class="block text-xs font-black text-gray-500 mb-2 uppercase tracking-widest">Seleccione Grado:</label>
                <select id="select-grado" class="w-full p-3 rounded-xl border-2 border-gray-200 focus:border-indigo-400 outline-none transition-all">
                    <option value="">Cargando mis grados...</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-black text-gray-500 mb-2 uppercase tracking-widest">Paralelo:</label>
                <select id="select-paralelo" class="w-full p-3 rounded-xl border-2 border-gray-200 focus:border-indigo-400 outline-none transition-all">
                    <option value="">Seleccione...</option>
                </select>
            </div>
            <button id="btn-cargar" class="bg-orange-400 hover:bg-orange-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg shadow-orange-200 transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-rotate"></i> CARGAR ESTUDIANTES
            </button>
        </div>
    </div>

    <div class="p-6">
        <div class="overflow-x-auto">
            <table class="w-full text-left">
                <thead>
                    <tr class="text-indigo-900 border-b-2 border-indigo-50">
                        <th class="px-4 py-3 text-xs font-black uppercase tracking-wider">Apellidos y Nombres</th>
                        <th class="px-4 py-3 text-xs font-black uppercase tracking-wider text-center">Cédula</th>
                        <th class="px-4 py-3 text-xs font-black uppercase tracking-wider text-center">NEE</th>
                        <th class="px-4 py-3 text-xs font-black uppercase tracking-wider text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-estudiantes" class="divide-y divide-gray-50">
                    <tr>
                        <td colspan="4" class="text-center py-12 text-gray-400 italic">
                            Seleccione un grado y paralelo para visualizar la nómina.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div class="mt-8 flex justify-between items-center">
            <a href="dashboard.html" class="text-gray-500 hover:text-indigo-600 font-bold transition-colors">
                <i class="fa-solid fa-arrow-left mr-2"></i> Volver al Dashboard
            </a>
            <div class="text-xs text-gray-400" id="contador-footer">Mostrando: 0 estudiantes</div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBsEeL_xG-koVvHWpTot5f1PeqNQo-eN8o",
        authDomain: "khipusmart360.firebaseapp.com",
        projectId: "khipusmart360",
        storageBucket: "khipusmart360.firebasestorage.app",
        messagingSenderId: "240593523716",
        appId: "1:240593523716:web:03cbfe1f8f41f1b2a75151"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let asignacionesDocente = [];

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            // 1. Obtener el periodo del Admin (en este caso lo seteamos fijo, pero podrías traerlo de una colección 'configuracion')
            const periodoActual = "2026-2027"; 
            document.getElementById('periodo-actual').innerText = periodoActual;

            // 2. Cargar Asignaciones del Docente
            const qAsig = query(
                collection(db, "asignaciones"), 
                where("id_docente", "==", user.uid),
                where("periodo", "==", periodoActual)
            );
            
            const snapAsig = await getDocs(qAsig);
            const selectGrado = document.getElementById('select-grado');
            selectGrado.innerHTML = '<option value="">Seleccione Grado...</option>';

            if(snapAsig.empty) {
                selectGrado.innerHTML = '<option value="">Sin asignaciones este periodo</option>';
                return;
            }

            // Guardamos las asignaciones y llenamos el selector de Grados (únicos)
            let gradosUnicos = new Set();
            snapAsig.forEach(docAsig => {
                const data = docAsig.data();
                asignacionesDocente.push(data);
                if(!gradosUnicos.has(data.id_grado)) {
                    gradosUnicos.add(data.id_grado);
                    selectGrado.innerHTML += `<option value="${data.id_grado}">${data.id_grado}</option>`;
                }
            });

            document.getElementById('info-docente').innerText = "Cursos vinculados para este periodo lectivo.";

        } else {
            window.location.href = "index.html";
        }
    });

    // Filtro dinámico: Al elegir grado, mostrar solo los paralelos asignados
    document.getElementById('select-grado').addEventListener('change', (e) => {
        const gradoSel = e.target.value;
        const selectParalelo = document.getElementById('select-paralelo');
        selectParalelo.innerHTML = '<option value="">Paralelo...</option>';
        
        const paralelosFiltrados = asignacionesDocente.filter(a => a.id_grado === gradoSel);
        paralelosFiltrados.forEach(p => {
            selectParalelo.innerHTML += `<option value="${p.id_paralelo}">${p.id_paralelo}</option>`;
        });
    });

    // Lógica para listar estudiantes
    document.getElementById('btn-cargar').addEventListener('click', async () => {
        const grado = document.getElementById('select-grado').value;
        const paralelo = document.getElementById('select-paralelo').value;
        const tabla = document.getElementById('tabla-estudiantes');

        if(!grado || !paralelo) {
            Swal.fire('Atención', 'Por favor seleccione grado y paralelo.', 'warning');
            return;
        }

        tabla.innerHTML = '<tr><td colspan="4" class="text-center py-12 text-indigo-500 font-bold">Buscando estudiantes...</td></tr>';

        try {
            const qEst = query(
                collection(db, "estudiantes"),
                where("id_grado", "==", grado),
                where("id_paralelo", "==", paralelo),
                orderBy("apellidos", "asc")
            );

            const snapEst = await getDocs(qEst);
            tabla.innerHTML = "";
            let contador = 0;

            if(snapEst.empty) {
                tabla.innerHTML = '<tr><td colspan="4" class="text-center py-12 text-gray-400 italic">No hay estudiantes registrados en este curso.</td></tr>';
            } else {
                snapEst.forEach(docEst => {
                    const e = docEst.data();
                    contador++;
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-indigo-50/50 transition-colors";
                    tr.innerHTML = `
                        <td class="px-4 py-4">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold text-xs">
                                    ${e.apellidos.charAt(0)}
                                </div>
                                <span class="font-medium text-gray-800">${e.apellidos} ${e.nombres}</span>
                            </div>
                        </td>
                        <td class="px-4 py-4 text-center font-mono text-gray-500 text-sm">${e.cedula || '---'}</td>
                        <td class="px-4 py-4 text-center">
                            <span class="px-2 py-1 rounded-md text-[10px] font-black ${e.nee === 'SI' ? 'bg-red-100 text-red-600' : 'bg-gray-100 text-gray-400'}">
                                ${e.nee === 'SI' ? 'NEE' : 'NO'}
                            </span>
                        </td>
                        <td class="px-4 py-4 text-center">
                            <button onclick="window.location.href='perfil_estudiante.html?id=${docEst.id}'" class="text-indigo-500 hover:text-indigo-700 p-2">
                                <i class="fa-solid fa-eye"></i>
                            </button>
                            <a href="https://wa.me/593${e.telefono_repre}" target="_blank" class="text-green-500 hover:text-green-700 p-2">
                                <i class="fa-brands fa-whatsapp"></i>
                            </a>
                        </td>
                    `;
                    tabla.appendChild(tr);
                });
            }
            document.getElementById('contador-footer').innerText = `Mostrando: ${contador} estudiantes`;
        } catch (error) {
            console.error(error);
            Swal.fire('Error', 'No se pudo cargar la lista.', 'error');
        }
    });
</script>
</body>
</html>
