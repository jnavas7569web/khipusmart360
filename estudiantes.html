<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KhipuSmart360 - Registro Estudiantes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --naranja: #ffb74d; --gris-fondo: #f4f7f6; --blanco: #ffffff; --azul: #5c6bc0; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--gris-fondo); margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { max-width: 600px; width: 100%; background: var(--blanco); padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: var(--azul); text-align: center; margin-bottom: 20px; }
        h3 { color: var(--azul); font-size: 1rem; border-bottom: 2px solid var(--gris-fondo); padding-bottom: 5px; margin-top: 20px; }
        .form-group { margin-bottom: 15px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; font-size: 0.9rem; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1rem; outline: none; }
        .btn-registrar { width: 100%; padding: 15px; background: var(--naranja); border: none; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 1.1rem; margin-top: 20px; transition: 0.3s; }
        .btn-registrar:hover { background: #ffa726; }
        .btn-volver { display: block; text-align: center; margin-top: 20px; text-decoration: none; color: #888; font-size: 0.9rem; }
        @media (max-width: 480px) { .grid-2 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <h2><i class="fa-solid fa-user-plus"></i> Registro de Estudiante</h2>
    
    <form id="form-estudiante">
        <h3>Datos del Estudiante</h3>
        <div class="grid-2">
            <div class="form-group">
                <label>Nombres:</label>
                <input type="text" id="nombres" placeholder="Ej: Alisson Briggitte" required>
            </div>
            <div class="form-group">
                <label>Apellidos:</label>
                <input type="text" id="apellidos" placeholder="Ej: Osorio Morales" required>
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>Cédula:</label>
                <input type="number" id="cedula" placeholder="1310..." required>
            </div>
            <div class="form-group">
                <label>Fecha Nacimiento:</label>
                <input type="date" id="fecha_nacimiento" required>
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>Grado / Año:</label>
                <select id="select-grado" required><option value="">Seleccione...</option></select>
            </div>
            <div class="form-group">
                <label>Paralelo:</label>
                <select id="select-paralelo" required><option value="">Seleccione...</option></select>
            </div>
        </div>

        <div class="form-group">
            <label>¿Estudiante NEE? (Discapacidad):</label>
            <select id="estudiante_NEE">
                <option value="no">No</option>
                <option value="si">Sí</option>
            </select>
        </div>

        <h3>Datos del Representante</h3>
        <div class="form-group">
            <label>Nombre del Representante:</label>
            <input type="text" id="representante" placeholder="Ej: Carmen Morales" required>
        </div>
        
        <div class="grid-2">
            <div class="form-group">
                <label>Cédula Representante:</label>
                <input type="number" id="representante_cedula" placeholder="12345678" required>
            </div>
            <div class="form-group">
                <label>Parentesco:</label>
                <select id="representante_parentesco" required>
                    <option value="Mamá">Mamá</option>
                    <option value="Papá">Papá</option>
                    <option value="Abuelo/a">Abuelo/a</option>
                    <option value="Tío/a">Tío/a</option>
                    <option value="Representante Legal">Representante Legal</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Teléfono (WhatsApp):</label>
            <input type="tel" id="telefono_representante" placeholder="0997652811" required>
        </div>

        <button type="submit" class="btn-registrar">GUARDAR ESTUDIANTE</button>
    </form>

    <a href="dashboard.html" class="btn-volver"><i class="fa-solid fa-arrow-left"></i> Volver al Panel</a>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBsEeL_xG-koVvHWpTot5f1PeqNQo-eN8o",
        authDomain: "khipusmart360.firebaseapp.com",
        projectId: "khipusmart360",
        storageBucket: "khipusmart360.firebasestorage.app",
        messagingSenderId: "240593523716",
        appId: "1:240593523716:web:03cbfe1f8f41f1b2a75151"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let docenteId = "";

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            docenteId = user.uid;
            cargarGrados();
            cargarParalelos();
        } else {
            window.location.href = "index.html";
        }
    });

    async function cargarGrados() {
        const selectGrado = document.getElementById('select-grado');
        const q = query(collection(db, "grados"), orderBy("orden", "asc"));
        const querySnapshot = await getDocs(q);
        querySnapshot.forEach((doc) => {
            let opt = document.createElement('option');
            opt.value = doc.id;
            opt.innerHTML = doc.data().nombre;
            selectGrado.appendChild(opt);
        });
    }

    async function cargarParalelos() {
        const selectParalelo = document.getElementById('select-paralelo');
        const querySnapshot = await getDocs(collection(db, "paralelos"));
        querySnapshot.forEach((doc) => {
            let opt = document.createElement('option');
            opt.value = doc.data().nombre;
            opt.innerHTML = doc.data().nombre;
            selectParalelo.appendChild(opt);
        });
    }

    document.getElementById('form-estudiante').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const data = {
            nombres: document.getElementById('nombres').value,
            apellidos: document.getElementById('apellidos').value,
            cedula: document.getElementById('cedula').value,
            estudiante_NEE: document.getElementById('estudiante_NEE').value,
            fecha_nacimiento: document.getElementById('fecha_nacimiento').value,
            id_grado: document.getElementById('select-grado').value,
            id_paralelo: document.getElementById('select-paralelo').value,
            representante: document.getElementById('representante').value,
            representante_cedula: document.getElementById('representante_cedula').value,
            representante_parentesco: document.getElementById('representante_parentesco').value,
            telefono_representante: document.getElementById('telefono_representante').value,
            id_docente: docenteId,
            fecha_registro: new Date()
        };

        try {
            await addDoc(collection(db, "estudiantes"), data);
            alert("✅ Estudiante registrado exitosamente.");
            document.getElementById('form-estudiante').reset();
        } catch (error) {
            console.error("Error:", error);
            alert("❌ Error al guardar.");
        }
    });
</script>
</body>
</html>
