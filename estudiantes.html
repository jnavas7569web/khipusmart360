<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KhipuSmart360 - Registro Integral de Estudiante</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --azul-ks: #5c6bc0; --gris-fondo: #f4f7f6; }
        body { background-color: var(--gris-fondo); font-family: 'Segoe UI', Tahoma, sans-serif; }
        .ks-card { background: white; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid #eee; }
        .ks-input { width: 100%; padding: 14px; border-radius: 12px; border: 2px solid #e0e0e0; transition: all 0.2s; font-size: 0.9rem;}
        .ks-input:focus { border-color: var(--azul-ks); outline: none; box-shadow: 0 0 0 4px rgba(92, 107, 192, 0.1); }
        .ks-label { display: block; text-transform: uppercase; font-size: 0.7rem; font-weight: 800; color: #757575; margin-bottom: 6px; letter-spacing: 1px;}
        .ks-header { background: linear-gradient(135deg, #5c6bc0 0%, #3f51b5 100%); border-radius: 24px 24px 0 0; }
        .separator { height: 1px; background: linear-gradient(to right, rgba(0,0,0,0), rgba(0,0,0,0.1), rgba(0,0,0,0)); margin: 30px 0; }
    </style>
</head>
<body class="p-6 md:p-12">

<div class="max-w-5xl mx-auto ks-card overflow-hidden">
    
    <div class="ks-header p-8 text-white flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-black tracking-tight"><i class="fa-solid fa-user-graduate mr-3"></i>Ficha Integral del Estudiante</h1>
            <p class="text-indigo-100 text-sm opacity-80" id="ks-subtitle">Complete la información del alumno y su representante legal.</p>
        </div>
        <button onclick="window.location.href='lista_estudiantes.html'" class="text-white bg-white/10 hover:bg-white/20 p-3 rounded-full transition">
            <i class="fa-solid fa-xmark text-lg"></i>
        </button>
    </div>

    <form id="form-estudiante" class="p-8 md:p-10 space-y-8">
        <input type="hidden" id="estudiante-id">

        <div>
            <div class="flex items-center gap-3 mb-6">
                <div class="w-10 h-10 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-500 border border-indigo-100">
                    <i class="fa-solid fa-id-card"></i>
                </div>
                <h2 class="text-lg font-bold text-gray-800">1. Información Personal del Alumno</h2>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="apellidos" class="ks-label">Apellidos Completos</label>
                    <input type="text" id="apellidos" class="ks-input" required placeholder="Ej: Osorio Morales">
                </div>
                <div>
                    <label for="nombres" class="ks-label">Nombres Completos</label>
                    <input type="text" id="nombres" class="ks-input" required placeholder="Ej: Alisson Briggitte">
                </div>
                <div>
                    <label for="cedula" class="ks-label">Cédula de Identidad</label>
                    <input type="text" id="cedula" class="ks-input" required placeholder="Ej: 13105545445" maxlength="10">
                </div>
                <div>
                    <label for="fecha_nacimiento" class="ks-label">Fecha de Nacimiento</label>
                    <input type="date" id="fecha_nacimiento" class="ks-input" required>
                </div>
                <div class="md:col-span-2">
                    <label for="direccion" class="ks-label">Dirección de Domicilio</label>
                    <input type="text" id="direccion" class="ks-input" required placeholder="Ej: Portoviejo - Centro, Calle Chile y América">
                </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-6 mt-6 p-5 bg-gray-50 rounded-xl border border-gray-100">
                <div>
    <label for="id_grado" class="ks-label">Grado / Año</label>
    <select id="id_grado" class="ks-input bg-white" required>
        <option value="">Seleccione...</option>
        <optgroup label="Educación Inicial">
            <option value="Inicial 1">Inicial 1</option>
            <option value="Inicial 2">Inicial 2</option>
        </optgroup>
        <optgroup label="Educación Básica">
            <option value="1">1ero EGB</option>
            <option value="2">2do EGB</option>
            <option value="3">3ero EGB</option>
            <option value="4">4to EGB</option>
            <option value="5">5to EGB</option>
            <option value="6">6to EGB</option>
            <option value="7">7mo EGB</option>
            <option value="8">8vo EGB</option>
            <option value="9">9no EGB</option>
            <option value="10">10mo EGB</option>
        </optgroup>
        <optgroup label="Bachillerato">
            <option value="1 Bachillerato">1ero Bachillerato</option>
            <option value="2 Bachillerato">2do Bachillerato</option>
            <option value="3 Bachillerato">3ero Bachillerato</option>
        </optgroup>
    </select>
</div>
                <div>
                    <label for="id_paralelo" class="ks-label">Paralelo</label>
                    <select id="id_paralelo" class="ks-input bg-white" required>
                        <option value="">Seleccione...</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                    </select>
                </div>
                <div class="col-span-2 flex items-center gap-4 pt-6">
                    <label class="ks-label mb-0">¿Estudiante NEE?</label>
                    <div class="flex items-center gap-2">
                        <input type="radio" id="nee_no" name="estudiante_nee" value="NO" checked class="w-5 h-5 accent-indigo-600">
                        <label for="nee_no" class="text-sm font-bold text-gray-600">NO</label>
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="radio" id="nee_si" name="estudiante_nee" value="SI" class="w-5 h-5 accent-red-600">
                        <label for="nee_si" class="text-sm font-bold text-red-600">SÍ</label>
                    </div>
                </div>
            </div>
        </div>

        <div class="separator"></div>

        <div>
            <div class="flex items-center gap-3 mb-6">
                <div class="w-10 h-10 rounded-full bg-orange-50 flex items-center justify-center text-orange-500 border border-orange-100">
                    <i class="fa-solid fa-hands-holding-child"></i>
                </div>
                <h2 class="text-lg font-bold text-gray-800">2. Información del Representante Legal</h2>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="md:col-span-2">
                    <label for="representante" class="ks-label">Nombre Completo del Representante</label>
                    <input type="text" id="representante" class="ks-input" required placeholder="Ej: Carmen Morales Rodríguez">
                </div>
                <div>
                    <label for="representante_cedula" class="ks-label">Cédula del Representante</label>
                    <input type="text" id="representante_cedula" class="ks-input" required placeholder="Ej: 1234567890" maxlength="10">
                </div>
                <div>
                    <label for="representante_parentesco" class="ks-label">Parentesco</label>
                    <select id="representante_parentesco" class="ks-input" required>
                        <option value="">Seleccione...</option>
                        <option value="Mama">Mamá</option>
                        <option value="Papa">Papá</option>
                        <option value="Tio/a">Tío/a</option>
                        <option value="Abuelo/a">Abuelo/a</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>
                <div>
                    <label for="telefono_representante" class="ks-label">Teléfono de Contacto (WhatsApp)</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-sm text-gray-400 font-bold">+593</span>
                        <input type="text" id="telefono_representante" class="ks-input pl-16" required placeholder="997652811" maxlength="9">
                    </div>
                </div>
            </div>
        </div>

        <div class="pt-10 flex flex-col md:flex-row gap-4 justify-end border-t border-gray-100 mt-12">
            <button type="button" onclick="window.location.href='lista_estudiantes.html'" class="bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold py-4 px-8 rounded-xl transition text-sm">
                <i class="fa-solid fa-arrow-left mr-2"></i> Cancelar y Volver
            </button>
            <button type="submit" id="btn-guardar" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-10 rounded-xl shadow-lg shadow-indigo-200 transition text-sm transform hover:scale-105">
                <i class="fa-solid fa-floppy-disk mr-2"></i> GUARDAR FICHA INTEGRAL
            </button>
        </div>
    </form>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, addDoc, collection, Timestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBsEeL_xG-koVvHWpTot5f1PeqNQo-eN8o",
        authDomain: "khipusmart360.firebaseapp.com",
        projectId: "khipusmart360",
        storageBucket: "khipusmart360.firebasestorage.app",
        messagingSenderId: "240593523716",
        appId: "1:240593523716:web:03cbfe1f8f41f1b2a75151"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // --- ESCUDO DE SEGURIDAD ---
    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            window.location.href = "index.html";
        } else {
            const docRef = doc(db, "usuarios", user.uid);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const userData = docSnap.data();
                const isAdmin = (userData.rol === 'admin' || userData.rol === 'superadmin');

                if (!isAdmin) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Acceso Denegado',
                        text: 'No tienes permisos para registrar o editar estudiantes.',
                        showConfirmButton: false,
                        timer: 2500
                    }).then(() => {
                        window.location.href = "dashboard.html";
                    });
                } else {
                    checkEditMode(); // Solo si es admin, revisamos si va a editar
                }
            }
        }
    });

    // Función para detectar si estamos editando
    async function checkEditMode() {
        const urlParams = new URLSearchParams(window.location.search);
        const estudianteId = urlParams.get('id');

        if (estudianteId) {
            document.getElementById('ks-subtitle').innerText = "Editando la información del estudiante seleccionado.";
            document.getElementById('btn-guardar').innerHTML = '<i class="fa-solid fa-pen-to-square mr-2"></i> ACTUALIZAR FICHA';
            
            const docRef = doc(db, "estudiantes", estudianteId);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const e = docSnap.data();
                document.getElementById('estudiante-id').value = estudianteId;
                
                document.getElementById('apellidos').value = e.apellidos || "";
                document.getElementById('nombres').value = e.Nombres || "";
                document.getElementById('cedula').value = e.cedula || "";
                document.getElementById('direccion').value = e.direccion || "";
                document.getElementById('id_grado').value = e.id_grado || "";
                document.getElementById('id_paralelo').value = e.id_paralelo || "";

                if (e.estudiante_NEE === 'SI') document.getElementById('nee_si').checked = true;
                else document.getElementById('nee_no').checked = true;

                if (e.fecha_nacimiento) {
                    const date = e.fecha_nacimiento.toDate();
                    const year = date.getFullYear();
                    const month = String(date.getMonth() + 1).padStart(2, '0');
                    const day = String(date.getDate()).padStart(2, '0');
                    document.getElementById('fecha_nacimiento').value = `${year}-${month}-${day}`;
                }

                document.getElementById('representante').value = e.representante || "";
                document.getElementById('representante_cedula').value = e.representante_cedula || "";
                document.getElementById('representante_parentesco').value = e.representante_parentesco || "";
                document.getElementById('telefono_representante').value = e.telefono_repre || "";
            }
        }
    }

    document.getElementById('form-estudiante').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        Swal.fire({
            title: 'Guardando datos...',
            allowOutsideClick: false,
            didOpen: () => { Swal.showLoading(); }
        });

        const id = document.getElementById('estudiante-id').value;
        const neeValue = document.querySelector('input[name="estudiante_nee"]:checked').value;
        const fechaNacInput = document.getElementById('fecha_nacimiento').value;

        const estudianteData = {
            Nombres: document.getElementById('nombres').value,
            apellidos: document.getElementById('apellidos').value,
            cedula: document.getElementById('cedula').value,
            direccion: document.getElementById('direccion').value,
            estudiante_NEE: neeValue,
            id_grado: document.getElementById('id_grado').value,
            id_paralelo: document.getElementById('id_paralelo').value,
            fecha_nacimiento: fechaNacInput ? Timestamp.fromDate(new Date(fechaNacInput)) : null,
            representante: document.getElementById('representante').value,
            representante_cedula: document.getElementById('representante_cedula').value,
            representante_parentesco: document.getElementById('representante_parentesco').value,
            telefono_repre: document.getElementById('telefono_representante').value
        };

        try {
            if (id) {
                await setDoc(doc(db, "estudiantes", id), estudianteData, { merge: true });
                Swal.fire({ icon: 'success', title: '¡Actualizado!', showConfirmButton: false, timer: 2000 })
                    .then(() => window.location.href = 'lista_estudiantes.html');
            } else {
                await addDoc(collection(db, "estudiantes"), estudianteData);
                Swal.fire({ icon: 'success', title: '¡Registrado!', showConfirmButton: false, timer: 2000 })
                    .then(() => window.location.href = 'lista_estudiantes.html');
            }
        } catch (error) {
            console.error(error);
            Swal.fire('Error', 'No se pudo guardar la información.', 'error');
        }
    });
</script>
</body>
</html>
