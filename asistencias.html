<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KhipuSmart360 - Control de Asistencia</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --azul: #5c6bc0; --naranja: #ffb74d; --gris-fondo: #f4f7f6; }
        body { background-color: var(--gris-fondo); font-family: 'Segoe UI', sans-serif; }
        .card-header { background: linear-gradient(135deg, #1a237e 0%, var(--azul) 100%); }
        .nombre-resaltado { color: #1a237e; font-weight: 800; text-transform: uppercase; }
        .check-asistencia { width: 28px; height: 28px; cursor: pointer; accent-color: #1b5e20; }
        .badge-festejo { background: #ff4081; color: white; padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 900; animation: pulse 1.5s infinite; display: inline-flex; align-items: center; gap: 4px; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body class="p-4 md:p-8">

<div class="max-w-6xl mx-auto bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100">
    <div class="card-header p-6 text-white flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-black tracking-tight"><i class="fa-solid fa-calendar-check mr-2"></i>CONTROL DE ASISTENCIA</h1>
            <p class="text-indigo-100 text-sm opacity-80" id="info-docente">Cargando asignaciones...</p>
        </div>
        <div class="bg-white/20 px-4 py-2 rounded-xl backdrop-blur-sm border border-white/30 text-center">
            <label class="text-[9px] uppercase font-bold block mb-1">Fecha de Registro</label>
            <input type="date" id="fecha-asistencia" class="bg-transparent border-none text-white font-bold outline-none cursor-pointer text-sm">
        </div>
    </div>

    <div class="p-6 bg-gray-50 border-b border-gray-100">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
            <div>
                <label class="block text-xs font-black text-gray-400 mb-2 uppercase tracking-widest">Grado Seleccionado:</label>
                <select id="select-grado" class="w-full p-3 rounded-xl border-2 border-gray-200 focus:border-indigo-400 outline-none transition-all bg-white font-bold text-gray-700">
                    <option value="">Cargando...</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-black text-gray-400 mb-2 uppercase tracking-widest">Paralelo:</label>
                <select id="select-paralelo" class="w-full p-3 rounded-xl border-2 border-gray-200 focus:border-indigo-400 outline-none transition-all bg-white font-bold text-gray-700">
                    <option value="">Seleccione...</option>
                </select>
            </div>
            <button id="btn-cargar" class="bg-orange-400 hover:bg-orange-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 transform active:scale-95">
                <i class="fa-solid fa-magnifying-glass"></i> GENERAR NÓMINA
            </button>
        </div>
    </div>

    <div class="p-6">
        <div class="overflow-x-auto rounded-xl border border-gray-100">
            <table class="w-full text-left text-xs">
                <thead class="bg-gray-100">
                    <tr class="text-indigo-900 border-b border-gray-200">
                        <th class="px-6 py-4 uppercase font-black tracking-wider">Apellidos y Nombres</th>
                        <th class="px-6 py-4 uppercase font-black tracking-wider text-center">Estado Especial</th>
                        <th class="px-6 py-4 uppercase font-black tracking-wider text-center">Asistencia (Presente)</th>
                    </tr>
                </thead>
                <tbody id="tabla-asistencia" class="divide-y divide-gray-100">
                    <tr>
                        <td colspan="3" class="text-center py-16 text-gray-400 italic">Seleccione los filtros superiores para iniciar el registro.</td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div class="mt-8 flex justify-between items-center">
            <a href="dashboard.html" class="text-gray-400 hover:text-indigo-600 font-bold transition-colors text-xs uppercase tracking-widest">
                <i class="fa-solid fa-chevron-left mr-2"></i> Volver al Panel
            </a>
            <button id="btn-guardar" class="hidden bg-indigo-600 hover:bg-indigo-800 text-white font-black py-4 px-12 rounded-2xl shadow-xl transition-all transform active:scale-95 uppercase text-sm tracking-widest">
                <i class="fa-solid fa-floppy-disk mr-2"></i> Guardar Asistencia
            </button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, query, where, getDocs, addDoc, Timestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBsEeL_xG-koVvHWpTot5f1PeqNQo-eN8o",
        authDomain: "khipusmart360.firebaseapp.com",
        projectId: "khipusmart360",
        storageBucket: "khipusmart360.firebasestorage.app",
        messagingSenderId: "240593523716",
        appId: "1:240593523716:web:03cbfe1f8f41f1b2a75151"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let asignacionesDocente = [];
    let uidDocente = "";

    // Inicializar fecha de hoy
    const inputFecha = document.getElementById('fecha-asistencia');
    inputFecha.valueAsDate = new Date();

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            uidDocente = user.uid;
            const qAsig = query(collection(db, "asignaciones"), where("id_docente", "==", user.uid));
            const snapAsig = await getDocs(qAsig);
            
            const selectGrado = document.getElementById('select-grado');
            selectGrado.innerHTML = '<option value="">Grado...</option>';

            snapAsig.forEach(doc => {
                const data = doc.data();
                asignacionesDocente.push(data);
                if(![...selectGrado.options].some(o => o.value === data.id_grado)) {
                    selectGrado.innerHTML += `<option value="${data.id_grado}">${data.id_grado}</option>`;
                }
            });
            document.getElementById('info-docente').innerText = "Registro vinculado a sus cursos asignados.";
        } else { window.location.href = "index.html"; }
    });

    document.getElementById('select-grado').addEventListener('change', (e) => {
        const selectParalelo = document.getElementById('select-paralelo');
        selectParalelo.innerHTML = '<option value="">Paralelo...</option>';
        asignacionesDocente.filter(a => a.id_grado === e.target.value).forEach(p => {
            selectParalelo.innerHTML += `<option value="${p.id_paralelo}">${p.id_paralelo}</option>`;
        });
    });

    document.getElementById('btn-cargar').addEventListener('click', async () => {
        const grado = document.getElementById('select-grado').value;
        const paralelo = document.getElementById('select-paralelo').value;
        const tabla = document.getElementById('tabla-asistencia');
        const fechaSel = new Date(inputFecha.value + "T12:00:00"); // Evita errores de zona horaria

        if(!grado || !paralelo) return Swal.fire('Atención', 'Seleccione Grado y Paralelo', 'warning');

        tabla.innerHTML = '<tr><td colspan="3" class="text-center py-12 italic text-indigo-500 font-bold">Generando lista...</td></tr>';

        try {
            const qEst = query(collection(db, "estudiantes"), where("id_grado", "==", grado), where("id_paralelo", "==", paralelo));
            const snapEst = await getDocs(qEst);
            let listaOrdenada = [];
            snapEst.forEach(doc => listaOrdenada.push({ id: doc.id, ...doc.data() }));
            
            // Ordenar por apellidos
            listaOrdenada.sort((a, b) => (a.apellidos || "").localeCompare(b.apellidos || ""));

            tabla.innerHTML = "";
            listaOrdenada.forEach(e => {
                let festejo = "--";
                if(e.fecha_nacimiento) {
                    const fNac = e.fecha_nacimiento.toDate();
                    if(fNac.getDate() === (fechaSel.getDate()) && fNac.getMonth() === fechaSel.getMonth()) {
                        festejo = '<span class="badge-festejo">🎉 FESTEJO</span>';
                    }
                }

                const tr = document.createElement('tr');
                tr.className = "hover:bg-indigo-50/50 transition-colors border-b border-gray-100";
                tr.innerHTML = `
                    <td class="px-6 py-4"><span class="nombre-resaltado">${e.apellidos || ''} ${e.Nombres || ''}</span></td>
                    <td class="px-6 py-4 text-center font-bold text-gray-400">${festejo}</td>
                    <td class="px-6 py-4 text-center">
                        <input type="checkbox" class="check-asistencia est-check" data-id="${e.id}" checked>
                    </td>
                `;
                tabla.appendChild(tr);
            });
            document.getElementById('btn-guardar').classList.remove('hidden');
        } catch (err) { console.error(err); }
    });

    document.getElementById('btn-guardar').addEventListener('click', async () => {
        const checks = document.querySelectorAll('.est-check');
        const grado = document.getElementById('select-grado').value;
        const paralelo = document.getElementById('select-paralelo').value;
        const fechaVal = new Date(inputFecha.value + "T00:00:00");

        Swal.fire({
            title: '¿Guardar asistencia?',
            text: "Se registrará el estado de todos los estudiantes.",
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#5c6bc0',
            confirmButtonText: 'Sí, guardar'
        }).then(async (result) => {
            if (result.isConfirmed) {
                try {
                    const promesas = Array.from(checks).map(c => {
                        return addDoc(collection(db, "asistencias_diarias"), {
                            id_docente: uidDocente,
                            id_grado: grado,
                            id_paralelo: paralelo,
                            id_estudiante: c.getAttribute('data-id'),
                            fecha: Timestamp.fromDate(fechaVal),
                            asistencia: c.checked ? "true" : "false"
                        });
                    });

                    await Promise.all(promesas);
                    Swal.fire('¡Listo!', 'Asistencia guardada con éxito.', 'success').then(() => location.reload());
                } catch (e) {
                    Swal.fire('Error', 'No se pudo guardar la información.', 'error');
                }
            }
        });
    });
</script>
</body>
</html>
