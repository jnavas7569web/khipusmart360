<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KhipuSmart360 - Reporte A4</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --azul: #1a237e; --gris-fondo: #f4f7f6; }
        body { background-color: var(--gris-fondo); font-family: 'Segoe UI', sans-serif; font-size: 11px; }
        .header-reporte { background: linear-gradient(135deg, #1a237e 0%, #5c6bc0 100%); color: white; }
        
        /* Badges de colores */
        .badge { padding: 2px 6px; border-radius: 4px; font-weight: 800; text-transform: uppercase; font-size: 8px; border: 1px solid; display: inline-block; }
        .badge-true { background: #dcfce7; color: #166534; border-color: #166534; }
        .badge-false { background: #fee2e2; color: #991b1b; border-color: #991b1b; }
        .badge-atraso { background: #fef3c7; color: #92400e; border-color: #92400e; }
        .badge-justificado { background: #e0f2fe; color: #075985; border-color: #075985; }

        /* OPTIMIZACIÓN PARA IMPRESIÓN A4 */
        @media print {
            @page { size: A4; margin: 10mm; }
            body { background: white !important; padding: 0 !important; }
            .no-print { display: none !important; }
            .print-card { box-shadow: none !important; border: 1px solid #eee !important; width: 100% !important; border-radius: 0 !important; }
            .header-reporte { background: #1a237e !important; color: white !important; -webkit-print-color-adjust: exact; padding: 15px !important; }
            table { width: 100% !important; table-layout: auto !important; }
            th, td { padding: 4px 8px !important; font-size: 10px !important; border-bottom: 1px solid #eee !important; }
            #chartPro { max-width: 100% !important; height: auto !important; max-height: 250px !important; }
            .badge { -webkit-print-color-adjust: exact; }
        }

        /* Estilo para compactar columnas P-F-A-J */
        .col-mini { width: 35px; text-align: center; }
    </style>
</head>
<body class="p-2 md:p-8">

<div class="max-w-5xl mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden border print-card">
    <div class="header-reporte p-6 text-center">
        <h1 class="text-xl font-black tracking-tighter uppercase italic">Control de Asistencia - Reporte Final</h1>
        <p id="info-filtros" class="text-indigo-100 text-[9px] font-bold mt-1 uppercase tracking-widest"></p>
    </div>

    <div class="p-4 bg-gray-50 border-b no-print">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-3 items-end">
            <div>
                <label class="block text-[8px] font-black text-gray-400 mb-1 uppercase tracking-widest">Curso:</label>
                <select id="select-curso" class="w-full p-2 bg-white border-2 border-gray-200 rounded-lg font-bold text-gray-700 text-xs outline-none focus:border-indigo-500">
                    <option value="">Cargando...</option>
                </select>
            </div>
            <div>
                <label class="block text-[8px] font-black text-gray-400 mb-1 uppercase tracking-widest">Desde:</label>
                <input type="date" id="f-desde" class="w-full p-2 bg-white border-2 border-gray-200 rounded-lg font-bold text-gray-700 text-xs">
            </div>
            <div>
                <label class="block text-[8px] font-black text-gray-400 mb-1 uppercase tracking-widest">Hasta:</label>
                <input type="date" id="f-hasta" class="w-full p-2 bg-white border-2 border-gray-200 rounded-lg font-bold text-gray-700 text-xs">
            </div>
            <button id="btn-procesar" class="bg-indigo-600 hover:bg-indigo-800 text-white font-black py-2.5 rounded-lg text-[9px] uppercase shadow-lg transition-all active:scale-95">
                <i class="fa-solid fa-sync mr-2"></i> Generar Reporte
            </button>
        </div>
    </div>

    <div class="p-4 md:p-6">
        <div class="overflow-x-auto mb-6">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr id="cabecera-dinamica" class="text-indigo-900 font-black uppercase text-[9px] tracking-tighter border-b-2">
                        </tr>
                </thead>
                <tbody id="tabla-pro" class="divide-y divide-gray-100 text-gray-700 font-medium">
                    <tr><td class="text-center py-10 italic">Seleccione los parámetros arriba.</td></tr>
                </tbody>
            </table>
        </div>

        <div id="visuales-pro" class="hidden">
            <div id="totales-pro" class="grid grid-cols-4 gap-2 mb-6 text-center font-bold"></div>
            <div id="grafico-pro" class="p-4 bg-gray-50 rounded-xl border flex justify-center">
                <div class="w-full max-w-2xl">
                    <canvas id="chartPro"></canvas>
                </div>
            </div>
        </div>

        <div class="mt-8 flex justify-between items-center no-print">
            <a href="dashboard.html" class="text-gray-400 hover:text-indigo-600 font-bold text-[9px] uppercase"><i class="fa-solid fa-arrow-left mr-1"></i> Dashboard</a>
            <button onclick="window.print()" class="bg-indigo-900 text-white px-6 py-2 rounded-lg font-black text-[9px] uppercase shadow-lg hover:bg-black transition-all">
                <i class="fa-solid fa-file-pdf mr-2"></i> Imprimir Reporte A4
            </button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, query, where, getDocs, Timestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBsEeL_xG-koVvHWpTot5f1PeqNQo-eN8o",
        authDomain: "khipusmart360.firebaseapp.com",
        projectId: "khipusmart360",
        storageBucket: "khipusmart360.firebasestorage.app",
        messagingSenderId: "240593523716",
        appId: "1:240593523716:web:03cbfe1f8f41f1b2a75151"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let miGrafico = null;

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            const q = query(collection(db, "asignaciones"), where("id_docente", "==", user.uid));
            const snap = await getDocs(q);
            const select = document.getElementById('select-curso');
            select.innerHTML = '<option value="">Seleccione Curso...</option>';
            snap.forEach(d => {
                const data = d.data();
                select.innerHTML += `<option value="${data.id_grado}|${data.id_paralelo}">${data.id_grado} - ${data.id_paralelo}</option>`;
            });
            const hoy = new Date();
            document.getElementById('f-desde').valueAsDate = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
            document.getElementById('f-hasta').valueAsDate = hoy;
        } else { window.location.href = "index.html"; }
    });

    document.getElementById('btn-procesar').addEventListener('click', async () => {
        const curso = document.getElementById('select-curso').value;
        const dStr = document.getElementById('f-desde').value;
        const hStr = document.getElementById('f-hasta').value;

        if(!curso || !dStr || !hStr) return;

        const [g, p] = curso.split('|');
        const finicio = new Date(dStr + "T00:00:00");
        const ffin = new Date(hStr + "T23:59:59");
        const esMismo = (dStr === hStr);

        document.getElementById('info-filtros').innerText = `Grado: ${g} "${p}" | Periodo: ${dStr} al ${hStr}`;

        try {
            const qE = query(collection(db, "estudiantes"), where("id_grado", "==", g), where("id_paralelo", "==", p));
            const snapE = await getDocs(qE);
            let estudiantes = [];
            snapE.forEach(d => estudiantes.push({ id: d.id, ...d.data() }));
            estudiantes.sort((a,b) => (a.apellidos || "").localeCompare(b.apellidos || ""));

            const qA = query(collection(db, "asistencias_diarias"), where("id_grado", "==", g), where("id_paralelo", "==", p));
            const snapA = await getDocs(qA);
            const dataAsis = snapA.docs.map(d => d.data());

            const tabla = document.getElementById('tabla-pro');
            tabla.innerHTML = "";
            
            const cabBase = `<th class="px-4 py-3 w-8 text-center">#</th><th class="px-4 py-3">Estudiante</th>`;
            if(esMismo){
                document.getElementById('cabecera-dinamica').innerHTML = cabBase + `<th class="px-4 py-3 text-center">Asistencia del Día</th>`;
            } else {
                document.getElementById('cabecera-dinamica').innerHTML = cabBase + `<th class="px-4 py-3">Representante</th><th class="col-mini text-green-700">P</th><th class="col-mini text-red-700">F</th><th class="col-mini text-orange-600">A</th><th class="col-mini text-blue-600">J</th>`;
            }

            let n = 1;
            let glob = { p:0, f:0, a:0, j:0, t:0 };
            let rank = [];

            estudiantes.forEach(est => {
                const misAsis = dataAsis.filter(a => {
                    const f = a.fecha.toDate();
                    return a.id_estudiante === est.id && f >= finicio && f <= ffin;
                });

                let c = { p:0, f:0, a:0, j:0 };
                let last = "---";
                misAsis.forEach(a => {
                    const st = String(a.asistencia).toLowerCase();
                    if(st === "true"){ c.p++; last = "true"; }
                    else if(st === "false"){ c.f++; last = "false"; }
                    else if(st === "atraso"){ c.a++; last = "atraso"; }
                    else if(st === "justificado"){ c.j++; last = "justificado"; }
                });

                const tr = document.createElement('tr');
                if(esMismo){
                    glob.t++; glob.p+=c.p; glob.f+=c.f; glob.a+=c.a; glob.j+=c.j;
                    tr.innerHTML = `<td class="px-4 py-2 text-center text-gray-400 font-bold">${n++}</td><td class="px-4 py-2 font-bold uppercase text-indigo-900">${est.apellidos} ${est.Nombres}</td><td class="px-4 py-2 text-center"><span class="badge badge-${last}">${traducir(last)}</span></td>`;
                } else {
                    rank.push({ n: (est.apellidos || "").split(' ')[0], v: c.f + c.a });
                    tr.innerHTML = `<td class="px-4 py-2 text-center text-gray-400 font-bold">${n++}</td><td class="px-4 py-2 font-bold uppercase text-indigo-900 text-[10px]">${est.apellidos} ${est.Nombres}</td><td class="px-4 py-2 text-[8px] leading-tight"><b>${est.representante || '---'}</b><br>${est.telefono_repre || ''}</td><td class="col-mini font-bold text-green-700">${c.p}</td><td class="col-mini font-bold text-red-700">${c.f}</td><td class="col-mini font-bold text-orange-600">${c.a}</td><td class="col-mini font-bold text-blue-600">${c.j}</td>`;
                }
                tabla.appendChild(tr);
            });

            document.getElementById('visuales-pro').classList.remove('hidden');
            if(esMismo){
                document.getElementById('grafico-pro').classList.add('hidden');
                document.getElementById('totales-pro').innerHTML = `<div class="bg-gray-50 p-2 rounded border">TOTAL: ${glob.t}</div><div class="bg-green-50 p-2 rounded border border-green-200 text-green-700">P: ${glob.p}</div><div class="bg-red-50 p-2 rounded border border-red-200 text-red-700">F: ${glob.f}</div><div class="bg-blue-50 p-2 rounded border border-blue-200 text-blue-700">J: ${glob.j}</div>`;
            } else {
                document.getElementById('totales-pro').innerHTML = "";
                document.getElementById('grafico-pro').classList.remove('hidden');
                actualizarGrafico(rank);
            }
        } catch (e) { console.error(e); }
    });

    function traducir(v) {
        const m = {"true":"Asistió", "false":"Falta", "atraso":"Atraso", "justificado":"Justificado"};
        return m[v] || "N/A";
    }

    function actualizarGrafico(datos) {
        const top = datos.sort((a,b) => b.v - a.v).filter(d => d.v > 0).slice(0, 5);
        const ctx = document.getElementById('chartPro').getContext('2d');
        if(miGrafico) miGrafico.destroy();
        if(top.length === 0) { document.getElementById('grafico-pro').classList.add('hidden'); return; }
        miGrafico = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: top.map(d => d.n),
                datasets: [{ label: 'Faltas + Atrasos', data: top.map(d => d.v), backgroundColor: '#1a237e', borderRadius: 4 }]
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: true,
                plugins: { legend: { display: false }, title: { display: true, text: 'Top 5 Estudiantes con más Novedades', font: { size: 10, weight: 'bold' } } },
                scales: { y: { beginAtZero: true, ticks: { font: { size: 8 } } }, x: { ticks: { font: { size: 8 } } } }
            }
        });
    }
</script>
</body>
</html>
