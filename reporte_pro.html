<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KhipuSmart360 - Reporte Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --azul: #1a237e; --gris-fondo: #f4f7f6; }
        /* TEXTO GRANDE PARA PC Y MÓVIL */
        body { background-color: var(--gris-fondo); font-family: 'Segoe UI', sans-serif; font-size: 14px; }
        .header-reporte { background: linear-gradient(135deg, #1a237e 0%, #5c6bc0 100%); color: white; }
        
        /* Badges robustos */
        .badge { padding: 5px 12px; border-radius: 8px; font-weight: 800; text-transform: uppercase; font-size: 11px; border: 2px solid; display: inline-block; }
        .badge-true { background: #dcfce7; color: #166534; border-color: #166534; }
        .badge-false { background: #fee2e2; color: #991b1b; border-color: #991b1b; }
        .badge-atraso { background: #fef3c7; color: #92400e; border-color: #92400e; }
        .badge-justificado { background: #e0f2fe; color: #075985; border-color: #075985; }

        /* AJUSTES DE IMPRESIÓN A4 */
        @media print {
            @page { size: A4; margin: 10mm; }
            .no-print { display: none !important; }
            .print-card { box-shadow: none !important; border: 1px solid #eee !important; width: 100% !important; border-radius: 0 !important; }
            .header-reporte { background: #1a237e !important; padding: 25px !important; -webkit-print-color-adjust: exact; }
            td, th { font-size: 13px !important; padding: 8px !important; }
            .badge { -webkit-print-color-adjust: exact; }
        }

        .col-mini { width: 50px; text-align: center; }
    </style>
</head>
<body class="p-2 md:p-6">

<div class="max-w-6xl mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden border print-card">
    <div class="header-reporte p-8 text-center">
        <h1 class="text-2xl md:text-4xl font-black tracking-tighter uppercase italic">Reporte de Asistencia</h1>
        <p id="info-filtros" class="text-indigo-100 text-sm md:text-lg font-bold mt-3 uppercase tracking-widest border-t border-white/20 pt-3 inline-block px-6"></p>
    </div>

    <div class="p-6 bg-gray-50 border-b no-print">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-5 items-end">
            <div>
                <label class="block text-xs font-black text-gray-500 mb-1 uppercase tracking-widest">Seleccionar Curso:</label>
                <select id="select-curso" class="w-full p-3.5 bg-white border-2 border-gray-200 rounded-xl font-bold text-gray-700 text-sm outline-none focus:border-indigo-500 transition-all">
                    <option value="">Cargando cursos...</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-black text-gray-500 mb-1 uppercase tracking-widest">Desde:</label>
                <input type="date" id="f-desde" class="w-full p-3.5 bg-white border-2 border-gray-200 rounded-xl font-bold text-gray-700 text-sm">
            </div>
            <div>
                <label class="block text-xs font-black text-gray-500 mb-1 uppercase tracking-widest">Hasta:</label>
                <input type="date" id="f-hasta" class="w-full p-3.5 bg-white border-2 border-gray-200 rounded-xl font-bold text-gray-700 text-sm">
            </div>
            <button id="btn-procesar" class="bg-indigo-600 hover:bg-indigo-800 text-white font-black py-4 rounded-xl text-xs uppercase shadow-lg transition-all active:scale-95">
                <i class="fa-solid fa-sync mr-2"></i> Generar Reporte
            </button>
        </div>
    </div>

    <div class="p-4 md:p-8">
        <div class="overflow-x-auto mb-10">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr id="cabecera-dinamica" class="text-indigo-900 font-black uppercase text-xs tracking-wider border-b-4 border-indigo-50">
                        <th class="px-6 py-4">Información General</th>
                    </tr>
                </thead>
                <tbody id="tabla-pro" class="divide-y divide-gray-100 text-gray-700 font-bold">
                    <tr><td class="text-center py-20 text-gray-400 italic text-xl font-medium">Use los filtros superiores para cargar la información.</td></tr>
                </tbody>
            </table>
        </div>

        <div id="visuales-pro" class="hidden">
            <div id="totales-pro" class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-10 text-center font-black text-sm uppercase">
                </div>
            
            <div id="grafico-pro" class="p-8 bg-gray-50 rounded-3xl border flex justify-center hidden">
                <div class="w-full max-w-4xl">
                    <canvas id="chartPro"></canvas>
                </div>
            </div>
        </div>

        <div class="mt-12 flex justify-between items-center no-print">
            <a href="dashboard.html" class="text-gray-400 hover:text-indigo-600 font-black text-xs uppercase tracking-widest transition-colors">
                <i class="fa-solid fa-arrow-left mr-2"></i> Dashboard
            </a>
            <button onclick="window.print()" class="bg-indigo-900 hover:bg-black text-white px-12 py-4 rounded-2xl font-black text-xs uppercase shadow-xl transition-all">
                <i class="fa-solid fa-file-pdf mr-2"></i> Imprimir (A4)
            </button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, query, where, getDocs, Timestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBsEeL_xG-koVvHWpTot5f1PeqNQo-eN8o",
        authDomain: "khipusmart360.firebaseapp.com",
        projectId: "khipusmart360",
        storageBucket: "khipusmart360.firebasestorage.app",
        messagingSenderId: "240593523716",
        appId: "1:240593523716:web:03cbfe1f8f41f1b2a75151"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let miGrafico = null;

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            const q = query(collection(db, "asignaciones"), where("id_docente", "==", user.uid));
            const snap = await getDocs(q);
            const select = document.getElementById('select-curso');
            select.innerHTML = '<option value="">Seleccione Curso...</option>';
            snap.forEach(d => {
                const data = d.data();
                select.innerHTML += `<option value="${data.id_grado}|${data.id_paralelo}">${data.id_grado} - ${data.id_paralelo}</option>`;
            });
            const hoy = new Date();
            document.getElementById('f-desde').valueAsDate = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
            document.getElementById('f-hasta').valueAsDate = hoy;
        } else { window.location.href = "index.html"; }
    });

    document.getElementById('btn-procesar').addEventListener('click', async () => {
        const curso = document.getElementById('select-curso').value;
        const dStr = document.getElementById('f-desde').value;
        const hStr = document.getElementById('f-hasta').value;

        if(!curso || !dStr || !hStr) return;

        const [g, p] = curso.split('|');
        const finicio = new Date(dStr + "T00:00:00");
        const ffin = new Date(hStr + "T23:59:59");
        const esMismo = (dStr === hStr);

        document.getElementById('info-filtros').innerText = `Grado: ${g} "${p}" | Fecha desde: ${dStr} al ${hStr}`;

        try {
            const qE = query(collection(db, "estudiantes"), where("id_grado", "==", g), where("id_paralelo", "==", p));
            const snapE = await getDocs(qE);
            let estudiantes = [];
            snapE.forEach(d => estudiantes.push({ id: d.id, ...d.data() }));
            estudiantes.sort((a,b) => (a.apellidos || "").localeCompare(b.apellidos || ""));

            const qA = query(collection(db, "asistencias_diarias"), where("id_grado", "==", g), where("id_paralelo", "==", p));
            const snapA = await getDocs(qA);
            const dataAsis = snapA.docs.map(d => d.data());

            const tabla = document.getElementById('tabla-pro');
            tabla.innerHTML = "";
            
            const cabBase = `<th class="px-6 py-4 w-16 text-center text-gray-400">#</th><th class="px-6 py-4">Apellidos y Nombres</th>`;
            
            if(esMismo){
                document.getElementById('cabecera-dinamica').innerHTML = cabBase + `<th class="px-6 py-4 text-center">Asistencia del Día</th>`;
            } else {
                document.getElementById('cabecera-dinamica').innerHTML = cabBase + `<th class="px-6 py-4">Representante / Teléfono</th><th class="col-mini text-green-700">P</th><th class="col-mini text-red-700">F</th><th class="col-mini text-orange-600">A</th><th class="col-mini text-blue-600">J</th>`;
            }

            let num = 1;
            let glob = { p:0, f:0, a:0, j:0, t:0 };
            let rank = [];

            estudiantes.forEach(est => {
                const misAsis = dataAsis.filter(a => {
                    const f = a.fecha.toDate();
                    return a.id_estudiante === est.id && f >= finicio && f <= ffin;
                });

                let c = { p:0, f:0, a:0, j:0 };
                let last = "---";
                misAsis.forEach(a => {
                    const st = String(a.asistencia).toLowerCase();
                    if(st === "true"){ c.p++; last = "true"; }
                    else if(st === "false"){ c.f++; last = "false"; }
                    else if(st === "atraso"){ c.a++; last = "atraso"; }
                    else if(st === "justificado"){ c.j++; last = "justificado"; }
                });

                const tr = document.createElement('tr');
                tr.className = "hover:bg-indigo-50/30 transition-colors border-b border-gray-100";
                
                if(esMismo){
                    glob.t++; glob.p += c.p; glob.f += c.f; glob.a += c.a; glob.j += c.j;
                    tr.innerHTML = `<td class="px-6 py-5 text-center text-gray-300 font-black text-lg">${num++}</td><td class="px-6 py-5 font-black uppercase text-indigo-900 text-sm">${est.apellidos} ${est.Nombres}</td><td class="px-6 py-5 text-center"><span class="badge badge-${last}">${traducir(last)}</span></td>`;
                } else {
                    rank.push({ n: (est.apellidos || "").split(' ')[0], v: c.f + c.a });
                    tr.innerHTML = `<td class="px-6 py-5 text-center text-gray-300 font-black text-lg">${num++}</td><td class="px-6 py-5 font-black uppercase text-indigo-900 text-sm">${est.apellidos} ${est.Nombres}</td><td class="px-6 py-5 text-xs leading-tight"><b>${est.representante || '---'}</b><br><span class="text-indigo-500 font-bold italic">${est.telefono_repre || ''}</span></td><td class="col-mini font-black text-green-700 text-base">${c.p}</td><td class="col-mini font-black text-red-700 text-base">${c.f}</td><td class="col-mini font-black text-orange-600 text-base">${c.a}</td><td class="col-mini font-black text-blue-600 text-base">${c.j}</td>`;
                }
                tabla.appendChild(tr);
            });

            document.getElementById('visuales-pro').classList.remove('hidden');
            if(esMismo){
                document.getElementById('grafico-pro').classList.add('hidden');
                document.getElementById('totales-pro').innerHTML = `
                    <div class="bg-gray-100 p-5 rounded-2xl border-2 border-gray-200">TOTAL: ${glob.t}</div>
                    <div class="bg-green-100 p-5 rounded-2xl border-2 border-green-200 text-green-700">P: ${glob.p}</div>
                    <div class="bg-red-100 p-5 rounded-2xl border-2 border-red-200 text-red-700">F: ${glob.f}</div>
                    <div class="bg-orange-100 p-5 rounded-2xl border-2 border-orange-200 text-orange-700">A: ${glob.a}</div>
                    <div class="bg-blue-100 p-5 rounded-2xl border-2 border-blue-200 text-blue-700">J: ${glob.j}</div>
                `;
            } else {
                document.getElementById('totales-pro').innerHTML = "";
                document.getElementById('grafico-pro').classList.remove('hidden');
                actualizarGrafico(rank);
            }
        } catch (e) { console.error(e); }
    });

    function traducir(v) {
        const m = {"true":"Asistió", "false":"Falta", "atraso":"Atraso", "justificado":"Justificado"};
        return m[v] || "N/A";
    }

    function actualizarGrafico(datos) {
        const top = datos.sort((a,b) => b.v - a.v).filter(d => d.v > 0).slice(0, 5);
        const ctx = document.getElementById('chartPro').getContext('2d');
        if(miGrafico) miGrafico.destroy();
        if(top.length === 0) { document.getElementById('grafico-pro').classList.add('hidden'); return; }
        
        const colores = ['#1a237e', '#ef5350', '#ffa726', '#26a69a', '#7e57c2'];
        miGrafico = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: top.map(d => d.n),
                datasets: [{ 
                    label: 'Faltas + Atrasos', 
                    data: top.map(d => d.v), 
                    backgroundColor: colores,
                    borderRadius: 12
                }]
            },
            options: { 
                responsive: true, 
                plugins: { 
                    legend: { display: false }, 
                    title: { display: true, text: 'Top 5 Estudiantes con más Novedades', font: { size: 18, weight: 'bold' }, padding: 25 } 
                },
                scales: { y: { beginAtZero: true, ticks: { font: { weight: 'bold' } } }, x: { ticks: { font: { weight: 'bold' } } } }
            }
        });
    }
</script>
</body>
</html>
