<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KhipuSmart360 - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans flex flex-col min-h-screen">

    <nav class="bg-blue-800 text-white p-4 shadow-xl flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-3 text-white">
            <div class="bg-white/10 p-2 rounded-lg backdrop-blur-md">
                <i class="fa-solid fa-graduation-cap text-xl"></i>
            </div>
            <h1 class="text-2xl font-black tracking-tight">KhipuSmart360</h1>
        </div>
        <div class="flex items-center space-x-4">
            <span class="hidden md:inline font-medium opacity-90 border-r pr-4 border-white/20">Prof. Jury Navas</span>
            <button id="logoutBtn" class="bg-red-500 hover:bg-red-600 px-5 py-2 rounded-xl text-sm font-bold transition-all shadow-md transform active:scale-95">
                <i class="fa-solid fa-power-off mr-1"></i> Salir
            </button>
        </div>
    </nav>

    <div class="flex flex-1">
        <aside class="hidden md:flex flex-col w-64 bg-white border-r border-gray-200 p-6 space-y-2">
            <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">Menú Principal</p>
            <a href="#" class="flex items-center space-x-3 p-3 bg-blue-50 text-blue-700 rounded-xl font-bold">
                <i class="fa-solid fa-house w-5"></i> <span>Inicio</span>
            </a>
            <a href="#" class="flex items-center space-x-3 p-3 text-gray-500 hover:bg-gray-50 rounded-xl transition">
                <i class="fa-solid fa-user-graduate w-5"></i> <span>Estudiantes</span>
            </a>
            <a href="#" class="flex items-center space-x-3 p-3 text-gray-500 hover:bg-gray-50 rounded-xl transition">
                <i class="fa-solid fa-clipboard-check w-5"></i> <span>Asistencia</span>
            </a>
            <div class="pt-6">
                <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">Tus 14 Grados</p>
                <select class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none font-medium">
                    <option>Seleccionar Grado...</option>
                    <option>1ero de Básica</option>
                    <option>2do de Básica</option>
                    <option>3ero de Básica</option>
                    </select>
            </div>
        </aside>

        <main class="flex-1 p-6 md:p-10">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
                <div class="bg-white p-6 rounded-2xl shadow-sm border-b-4 border-blue-500">
                    <p class="text-gray-400 text-xs font-bold uppercase tracking-widest">Alumnos</p>
                    <h3 class="text-3xl font-black text-gray-800">24</h3>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border-b-4 border-purple-500">
                    <p class="text-gray-400 text-xs font-bold uppercase tracking-widest">Grados</p>
                    <h3 class="text-3xl font-black text-gray-800">14</h3>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border-b-4 border-yellow-500">
                    <p class="text-gray-400 text-xs font-bold uppercase tracking-widest">Pendientes</p>
                    <h3 class="text-3xl font-black text-gray-800">5</h3>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border-b-4 border-green-500">
                    <p class="text-gray-400 text-xs font-bold uppercase tracking-widest">Estado</p>
                    <h3 class="text-3xl font-black text-green-600">Online</h3>
                </div>
            </div>

            <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="p-6 border-b border-gray-50 flex flex-col md:flex-row justify-between items-center gap-4">
                    <h4 class="text-xl font-bold text-gray-800">Lista de Estudiantes</h4>
                    <button class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-xl font-bold transition flex items-center shadow-lg active:scale-95">
                        <i class="fa-solid fa-plus mr-2"></i> Nuevo Estudiante
                    </button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-gray-50 text-gray-400 text-xs font-black uppercase tracking-widest">
                            <tr>
                                <th class="px-6 py-4 italic">Nombre Completo</th>
                                <th class="px-6 py-4 italic">Grado</th>
                                <th class="px-6 py-4 italic">Estado</th>
                                <th class="px-6 py-4 italic">Acciones</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-50">
                            <tr class="hover:bg-blue-50/30 transition">
                                <td class="px-6 py-4 font-semibold text-gray-700 italic">Ejemplo: Juan Pérez</td>
                                <td class="px-6 py-4"><span class="bg-purple-100 text-purple-700 text-xs font-bold px-3 py-1 rounded-full uppercase">3ero EGB</span></td>
                                <td class="px-6 py-4"><span class="text-green-500 font-bold text-sm">Activo</span></td>
                                <td class="px-6 py-4">
                                    <button class="text-blue-500 hover:text-blue-700 mr-3"><i class="fa-solid fa-pen"></i></button>
                                    <button class="text-red-400 hover:text-red-600"><i class="fa-solid fa-trash"></i></button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        document.getElementById('logoutBtn').addEventListener('click', () => {
            window.location.href = "index.html";
        });
    </script>
</body>
</html>
