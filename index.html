<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KhipuSmart360 - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-900 flex items-center justify-center h-screen font-sans">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-96 border-t-4 border-blue-600">
        <h2 class="text-3xl font-extrabold mb-2 text-center text-gray-800 tracking-tighter">KhipuSmart360</h2>
        <p class="text-sm text-gray-400 mb-8 text-center uppercase tracking-widest font-bold">Panel de Control</p>
        
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-[10px] font-black text-gray-400 mb-1 uppercase tracking-widest">Correo Electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@gmail.com" required
                    class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition font-medium italic">
            </div>
            <div>
                <label class="block text-[10px] font-black text-gray-400 mb-1 uppercase tracking-widest">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required
                    class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
            </div>
            
            <button type="submit" id="loginBtn" class="w-full bg-blue-600 text-white font-black py-4 rounded-xl hover:bg-blue-700 transform hover:scale-[1.02] active:scale-95 transition shadow-lg mt-4 tracking-widest uppercase text-sm">
                Ingresar al Sistema
            </button>

            <p class="text-center mt-4">
                <a href="#" id="btn-olvido" class="text-blue-500 hover:text-blue-700 text-xs font-bold transition-all no-underline">
                    <i class="fa-solid fa-lock-open mr-1"></i> ¿Olvidaste tu contraseña?
                </a>
            </p>
        </form>
        
        <p id="message" class="mt-6 text-center text-red-500 text-xs font-bold h-4 italic"></p>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBsEeL_xG-koVvHWpTot5f1PeqNQo-eN8o",
        authDomain: "khipusmart360.firebaseapp.com",
        projectId: "khipusmart360",
        storageBucket: "khipusmart360.firebasestorage.app",
        messagingSenderId: "240593523716",
        appId: "1:240593523716:web:03cbfe1f8f41f1b2a75151"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    auth.languageCode = 'es'; // Asegura que el correo de reset llegue en español

    const loginForm = document.getElementById('login-form');
    const msg = document.getElementById('message');

    // --- LÓGICA DE INICIO DE SESIÓN ---
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        const btn = document.getElementById('loginBtn');

        // Estilo de carga en el botón
        btn.disabled = true;
        btn.innerText = "VALIDANDO ACCESO...";
        msg.innerText = "";

        try {
            await signInWithEmailAndPassword(auth, email, pass);
            
            // Alerta de éxito antes de redirigir
            Swal.fire({
                title: '¡Acceso Correcto!',
                text: 'Bienvenido a KhipuSmart360',
                icon: 'success',
                timer: 1500,
                showConfirmButton: false,
                willClose: () => {
                    window.location.href = "dashboard.html";
                }
            });

        } catch (error) {
            console.error(error);
            btn.disabled = false;
            btn.innerText = "INGRESAR AL SISTEMA";
            
            let errorMsg = "Credenciales incorrectas.";
            if (error.code === 'auth/user-not-found') errorMsg = "El usuario no existe.";
            if (error.code === 'auth/wrong-password') errorMsg = "Contraseña incorrecta.";
            
            Swal.fire({
                title: 'Error de Acceso',
                text: errorMsg,
                icon: 'error',
                confirmButtonColor: '#2563eb'
            });
        }
    });

    // --- LÓGICA DE RECUPERAR CONTRASEÑA (SweetAlert2 Pro) ---
    document.getElementById('btn-olvido').addEventListener('click', async (e) => {
        e.preventDefault();

        const { value: email } = await Swal.fire({
            title: 'Recuperar Contraseña',
            html: '<p class="text-sm text-gray-600">Enviaremos un enlace a tu correo para que puedas cambiar tu clave de forma segura.</p>',
            input: 'email',
            inputPlaceholder: 'tu-correo@ejemplo.com',
            confirmButtonColor: '#2563eb',
            confirmButtonText: 'Enviar Enlace',
            showCancelButton: true,
            cancelButtonText: 'Cancelar',
            cancelButtonColor: '#d33',
            inputAttributes: { autocapitalize: 'off', autocorrect: 'off' }
        });

        if (email) {
            try {
                await sendPasswordResetEmail(auth, email);
                
                Swal.fire({
                    title: '¡Enlace Enviado!',
                    html: `<div class="text-left p-2">
                            <p><b>KhipuSmart360 Informa:</b></p>
                            <p class="mt-2">Se ha enviado un correo a: <b>${email}</b></p>
                            <p class="mt-2 text-xs text-gray-500 italic">Si no lo ves, revisa la carpeta de Correo No Deseado o Spam.</p>
                           </div>`,
                    icon: 'success',
                    confirmButtonColor: '#2563eb'
                });
            } catch (error) {
                console.error(error);
                let msgError = "No se pudo enviar el correo.";
                if (error.code === 'auth/user-not-found') msgError = "Este correo no está registrado en el sistema.";
                
                Swal.fire('Error', msgError, 'error');
            }
        }
    });
</script>
</body>
</html>
