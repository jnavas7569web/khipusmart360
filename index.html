<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KhipuSmart360 - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-900 flex items-center justify-center h-screen font-sans">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-96 border-t-4 border-blue-600">
        <h2 class="text-3xl font-extrabold mb-2 text-center text-gray-800 tracking-tighter">KhipuSmart360</h2>
        <p class="text-sm text-gray-400 mb-8 text-center uppercase tracking-widest font-bold">Panel de Control</p>
        
        <div class="space-y-4">
            <div>
                <label class="block text-[10px] font-black text-gray-400 mb-1 uppercase tracking-widest">Correo Electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@gmail.com" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition font-medium italic">
            </div>
            <div>
                <label class="block text-[10px] font-black text-gray-400 mb-1 uppercase tracking-widest">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
            </div>
            
            <button id="loginBtn" class="w-full bg-blue-600 text-white font-black py-4 rounded-xl hover:bg-blue-700 transform hover:scale-[1.02] active:scale-95 transition shadow-lg mt-4 tracking-widest uppercase text-sm">
                Ingresar al Sistema
            </button>
            <!-- //////////////////////////// -->
            <p style="text-align:center; margin-top:15px;">
    <a href="#" id="btn-olvido" style="color: #5c6bc0; text-decoration:none; font-size: 0.9rem;">¿Olvidaste tu contraseña?</a>
            </p>
            <!-- ////////////////// -->
        </div>
        
        <p id="message" class="mt-6 text-center text-red-500 text-xs font-bold h-4 italic"></p>
    </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    // IMPORTANTE: Asegúrate de añadir 'sendPasswordResetEmail' aquí arriba
    import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        // ... tu configuración de siempre ...
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // --- AQUÍ VA TU LÓGICA DE LOGIN NORMAL (btn-entrar) ---
    // document.getElementById('btn-entrar').addEventListener('click', ... )


    // --- AQUÍ PEGAS LA FUNCIÓN DE RECUPERAR CLAVE ---
    document.getElementById('btn-olvido').addEventListener('click', async (e) => {
        e.preventDefault();

        // 1. Pedimos el correo con SweetAlert2
        const { value: email } = await Swal.fire({
            title: 'Recuperar Acceso',
            text: 'Escribe tu correo para enviarte un enlace de restauración.',
            input: 'email',
            inputPlaceholder: 'ejemplo@correo.com',
            confirmButtonColor: '#5c6bc0',
            confirmButtonText: 'Enviar enlace',
            showCancelButton: true,
            cancelButtonText: 'Cancelar'
        });

        // 2. Si el usuario escribió un correo, procedemos
        if (email) {
            try {
                // Función mágica de Firebase para enviar el correo
                await sendPasswordResetEmail(auth, email);
                
                Swal.fire({
                    title: '¡Correo Enviado!',
                    text: 'KhipuSmart Informa: Revisa tu bandeja de entrada o spam para cambiar tu clave.',
                    icon: 'success',
                    confirmButtonColor: '#5c6bc0'
                });
            } catch (error) {
                console.error(error);
                let mensaje = "No pudimos enviar el correo.";
                if (error.code === 'auth/user-not-found') mensaje = "Este correo no está registrado.";
                
                Swal.fire('Error', mensaje, 'error');
            }
        }
    });
</script>
</body>
</html>
