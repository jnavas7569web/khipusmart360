<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KhipuSmart360 - Gestión de Personal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --verde: #2e7d32; --gris-fondo: #f4f7f6; --blanco: #ffffff; --azul: #5c6bc0; --naranja: #f57c00; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--gris-fondo); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 550px; width: 100%; background: var(--blanco); padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: var(--verde); text-align: center; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #444; font-size: 0.9rem; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1rem; outline: none; }
        input:focus { border-color: var(--azul); }
        .btn-guardar { width: 100%; padding: 15px; background: var(--verde); border: none; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 1.1rem; transition: 0.3s; margin-top: 10px; }
        .btn-actualizar { background: var(--naranja); }
        .btn-guardar:hover { opacity: 0.9; }
        .btn-volver { display: block; text-align: center; margin-top: 20px; text-decoration: none; color: #888; font-size: 0.9rem; }
        .badge-info { background: #e3f2fd; color: #0d47a1; padding: 8px; border-radius: 5px; font-size: 0.8rem; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="titulo-form"><i class="fa-solid fa-user-plus"></i> Registro de Personal</h2>
    
    <div id="mensaje-busqueda" class="badge-info"></div>

    <form id="form-usuario">
        <div class="form-group">
            <label>N° de Cédula (Presiona Tab o clic fuera para buscar):</label>
            <input type="number" id="cedula" placeholder="Ingrese cédula para buscar o registrar" required>
        </div>

        <div class="form-group">
            <label>Nombre Completo:</label>
            <input type="text" id="nombre_completo" placeholder="Ej: Carlos Alberto Pérez" required disabled>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>Rol del Sistema:</label>
                <select id="rol" required disabled>
                    <option value="docente">Docente (Profesor)</option>
                    <option value="admin">Administrador</option>
                </select>
            </div>
            <div class="form-group">
                <label>Título más alto:</label>
                <select id="titulo_mas_alto" required disabled>
                    <option value="">Seleccione...</option>
                    <option value="Tercer nivel: Licenciatura">Tercer nivel: Licenciatura</option>
                    <option value="Tercer nivel: Otros (Ing., Econ., etc.)">Tercer nivel: Otros (Ing., Econ., etc.)</option>
                    <option value="Cuarto nivel: Magister">Cuarto nivel: Magister</option>
                    <option value="Cuarto nivel: PhD">Cuarto nivel: PhD</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Correo Electrónico:</label>
            <input type="email" id="correo" placeholder="correo@ejemplo.com" required disabled>
        </div>

        <div id="seccion-password" class="form-group">
            <label>Contraseña Temporal:</label>
            <input type="password" id="clave" placeholder="Mínimo 6 caracteres" disabled>
        </div>

        <button type="submit" class="btn-guardar" id="btn-submit" disabled>REGISTRAR EN KHIPUSMART</button>
    </form>

    <a href="dashboard.html" class="btn-volver"><i class="fa-solid fa-arrow-left"></i> Volver al Dashboard</a>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDocs, collection, query, where, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBsEeL_xG-koVvHWpTot5f1PeqNQo-eN8o",
        authDomain: "khipusmart360.firebaseapp.com",
        projectId: "khipusmart360",
        storageBucket: "khipusmart360.firebasestorage.app",
        messagingSenderId: "240593523716",
        appId: "1:240593523716:web:03cbfe1f8f41f1b2a75151"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const secondaryAuth = getAuth(initializeApp(firebaseConfig, "Secondary"));

    let editandoID = null;
    const inputCedula = document.getElementById('cedula');
    const formInputs = ['nombre_completo', 'rol', 'titulo_mas_alto', 'correo', 'clave', 'btn-submit'];

    // FUNCIÓN PARA BUSCAR USUARIO POR CÉDULA
    inputCedula.addEventListener('blur', async () => {
        const cedulaVal = inputCedula.value;
        if (cedulaVal.length < 9) return;

        const msgBusqueda = document.getElementById('mensaje-busqueda');
        msgBusqueda.style.display = 'block';
        msgBusqueda.innerText = "🔍 Buscando en la base de datos...";

        try {
            const q = query(collection(db, "usuarios"), where("cedula", "==", cedulaVal));
            const querySnapshot = await getDocs(q);

            // Habilitar campos
            formInputs.forEach(id => document.getElementById(id).disabled = false);

            if (!querySnapshot.empty) {
                // USUARIO ENCONTRADO - MODO EDICIÓN
                const userDoc = querySnapshot.docs[0];
                const data = userDoc.data();
                editandoID = userDoc.id;

                document.getElementById('nombre_completo').value = data.nombre_completo;
                document.getElementById('rol').value = data.rol;
                document.getElementById('titulo_mas_alto').value = data.titulo_mas_alto;
                document.getElementById('correo').value = data.correo;
                
                document.getElementById('seccion-password').style.display = 'none';
                document.getElementById('btn-submit').innerText = "ACTUALIZAR DATOS";
                document.getElementById('btn-submit').classList.add('btn-actualizar');
                document.getElementById('titulo-form').innerHTML = '<i class="fa-solid fa-user-pen"></i> Editar Usuario';
                msgBusqueda.innerText = "✅ Usuario encontrado. Puede modificar sus datos.";
            } else {
                // USUARIO NUEVO
                editandoID = null;
                document.getElementById('form-usuario').reset();
                inputCedula.value = cedulaVal; // Mantener cedula
                document.getElementById('seccion-password').style.display = 'block';
                document.getElementById('btn-submit').innerText = "REGISTRAR EN KHIPUSMART";
                document.getElementById('btn-submit').classList.remove('btn-actualizar');
                document.getElementById('titulo-form').innerHTML = '<i class="fa-solid fa-user-plus"></i> Registro de Personal';
                msgBusqueda.innerText = "✨ Cédula nueva. Complete el registro.";
            }
        } catch (e) { console.error(e); }
    });

    // GUARDAR O ACTUALIZAR
    document.getElementById('form-usuario').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-submit');
        btn.innerText = "Procesando...";
        btn.disabled = true;

        const data = {
            nombre_completo: document.getElementById('nombre_completo').value,
            cedula: document.getElementById('cedula').value,
            rol: document.getElementById('rol').value,
            titulo_mas_alto: document.getElementById('titulo_mas_alto').value,
            correo: document.getElementById('correo').value,
            ultima_modificacion: serverTimestamp()
        };

        try {
            if (editandoID) {
                // ACTUALIZAR EXISTENTE
                await updateDoc(doc(db, "usuarios", editandoID), data);
                alert("✅ Datos actualizados correctamente.");
            } else {
                // REGISTRAR NUEVO
                const pass = document.getElementById('clave').value;
                const userCred = await createUserWithEmailAndPassword(secondaryAuth, data.correo, pass);
                await setDoc(doc(db, "usuarios", userCred.user.uid), { ...data, creacion: serverTimestamp(), estado: true });
                await signOut(secondaryAuth);
                alert("✅ Usuario registrado exitosamente.");
            }
            location.reload();
        } catch (error) {
            alert("❌ Error: " + error.message);
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
