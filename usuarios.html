<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KhipuSmart360 - Gestión de Usuarios</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --verde: #2e7d32; --gris-fondo: #f4f7f6; --blanco: #ffffff; --azul: #5c6bc0; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--gris-fondo); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 500px; width: 100%; background: var(--blanco); padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: var(--verde); text-align: center; margin-top: 0; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #444; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        .btn-guardar { width: 100%; padding: 15px; background: var(--verde); border: none; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 1.1rem; transition: 0.3s; }
        .btn-guardar:hover { background: #1b5e20; }
        .btn-volver { display: block; text-align: center; margin-top: 20px; text-decoration: none; color: #888; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <h2><i class="fa-solid fa-user-shield"></i> Nuevo Usuario</h2>
    <p style="text-align: center; color: #666; font-size: 0.9rem;">Registrar nuevo personal administrativo o docente.</p>
    
    <form id="form-usuario">
        <div class="form-group">
            <label>Nombre Completo:</label>
            <input type="text" id="nombre_completo" placeholder="Ej: Maria Auxiliadora" required>
        </div>

        <div class="form-group">
            <label>Correo Electrónico:</label>
            <input type="email" id="correo" placeholder="correo@ejemplo.com" required>
        </div>

        <div class="form-group">
            <label>Rol del Sistema:</label>
            <select id="rol" required>
                <option value="docente">Docente (Profesor)</option>
                <option value="admin">Administrador</option>
            </select>
        </div>

        <div class="form-group">
            <label>Contraseña Temporal:</label>
            <input type="password" id="clave" placeholder="Mínimo 6 caracteres" required>
        </div>

        <button type="submit" class="btn-guardar">REGISTRAR USUARIO</button>
    </form>

    <a href="dashboard.html" class="btn-volver"><i class="fa-solid fa-arrow-left"></i> Volver al Dashboard</a>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBsEeL_xG-koVvHWpTot5f1PeqNQo-eN8o",
        authDomain: "khipusmart360.firebaseapp.com",
        projectId: "khipusmart360",
        storageBucket: "khipusmart360.firebasestorage.app",
        messagingSenderId: "240593523716",
        appId: "1:240593523716:web:03cbfe1f8f41f1b2a75151"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Solo un admin puede estar aquí
    onAuthStateChanged(auth, (user) => {
        if (!user || user.email !== "jnavas7569@gmail.com") {
            window.location.href = "dashboard.html";
        }
    });

    document.getElementById('form-usuario').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('correo').value;
        const password = document.getElementById('clave').value;
        const nombre = document.getElementById('nombre_completo').value;
        const rolSeleccionado = document.getElementById('rol').value;

        try {
            // 1. Crear usuario en Firebase Auth (Seguridad)
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            const nuevoId = userCredential.user.uid;

            // 2. Crear el documento en Firestore (Tu BD)
            await setDoc(doc(db, "usuarios", nuevoId), {
                nombre_completo: nombre,
                correo: email,
                rol: rolSeleccionado,
                estado: true,
                creacion: serverTimestamp()
            });

            alert("✅ ¡Usuario creado con éxito!");
            document.getElementById('form-usuario').reset();
            
        } catch (error) {
            console.error(error);
            alert("❌ Error: " + error.message);
        }
    });
</script>
</body>
</html>
