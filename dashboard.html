<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KhipuSmart360 - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* --- ESTILOS BASE --- */
        :root {
            --blanco: #ffffff;
            --gris-fondo: #f4f7f6;
            --gris-texto: #333333;
            --gris-suave: #e0e0e0;
            --naranja: #ffb74d; /* Mis Estudiantes */
            --celeste: #4dd0e1;  /* Notas */
            --rojo: #ef5350;     /* Reportes */
            --morado: #ba68c8;   /* Asistencias */
            --azul: #5c6bc0;     /* Configuración */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: var(--gris-fondo);
            color: var(--gris-texto);
            display: flex; /* Para el menú lateral */
            height: 100vh;
            overflow: hidden;
        }

        /* --- MENÚ LATERAL (SIDEBAR) - OCULTO EN MÓVIL --- */
        .sidebar {
            width: 250px;
            background-color: var(--blanco);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--gris-suave);
            transition: transform 0.3s ease;
            position: fixed; /* Flota sobre el contenido en móvil */
            height: 100%;
            z-index: 1000;
            transform: translateX(-100%); /* Oculto por defecto */
        }

        /* Cuando el menú está abierto */
        .sidebar.active {
            transform: translateX(0);
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--gris-suave);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-logo {
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--gris-texto);
        }

        .close-menu {
            display: none; /* Solo en móvil */
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .sidebar-menu {
            flex: 1;
            padding: 20px 0;
        }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 15px 25px;
            text-decoration: none;
            color: var(--gris-texto);
            font-weight: 500;
            transition: background 0.2s;
        }

        .menu-item:hover {
            background-color: var(--gris-fondo);
        }

        .menu-item i {
            margin-right: 15px;
            font-size: 1.1rem;
            width: 20px;
            text-align: center;
        }

        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid var(--gris-suave);
        }

        .btn-salir {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 10px;
            background: none;
            border: 1px solid var(--gris-texto);
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            color: var(--gris-texto);
        }

        /* --- CONTENIDO PRINCIPAL --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            margin-left: 0; /* Por defecto en móvil */
            transition: margin-left 0.3s ease;
            overflow-y: auto;
        }

        /* --- BARRA SUPERIOR (NAVBAR) --- */
        .navbar {
            background-color: var(--blanco);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--gris-suave);
            position: sticky;
            top: 0;
            z-index: 900;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .hamburger {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--gris-texto);
        }

        .nav-logo {
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--gris-texto);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-info {
            text-align: right;
        }

        .user-name-role {
            font-weight: bold;
            font-size: 0.9rem;
        }

        .user-course {
            font-size: 0.8rem;
            color: #666;
        }

        .esc-logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--gris-suave);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 0.8rem;
            color: #555;
            border: 1px solid #ccc;
        }

        /* --- PANEL CENTRAL (DASHBOARD BODY) --- */
        .dashboard-body {
            padding: 25px;
        }

        /* --- REJILLA DE TARJETAS (GRIDS) --- */
        .cards-grid {
            display: grid;
            gap: 20px;
            margin-bottom: 30px;
            /* Por defecto, 1 columna en móvil */
            grid-template-columns: repeat(1, 1fr); 
        }

        /* --- ESTILOS DE TARJETAS (CARDS) --- */
        .card {
            background-color: var(--blanco);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--gris-suave);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }

        /* Tarjetas de Resumen */
        .summary-card {
            text-align: center;
        }

        .summary-title {
            font-size: 0.8rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .summary-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--gris-texto);
        }

        .best-students-list {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: left;
            font-size: 0.9rem;
        }

        .best-students-list li {
            padding: 5px 0;
            display: flex;
            align-items: center;
        }

        .best-students-list li::before {
            content: '•';
            color: var(--morado);
            font-weight: bold;
            margin-right: 10px;
        }

        /* Botones de Acción de Colores (Los del mosaico) */
        .action-card {
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            color: var(--blanco);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 120px;
        }

        .action-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .action-icon {
            font-size: 2rem;
            opacity: 0.8;
            align-self: flex-start;
        }

        .action-text {
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            text-align: right;
            align-self: flex-end;
        }

        /* Colores Específicos de tu Bosquejo */
        .card-naranja { background-color: var(--naranja); }
        .card-celeste { background-color: var(--celeste); }
        .card-rojo { background-color: var(--rojo); }
        .card-morado { background-color: var(--morado); }
        .card-azul { background-color: var(--azul); }

        /* --- RESPONSIVE / ADAPTACIÓN A PANTALLAS --- */
        
        /* Pantallas Medianas (Tablets) */
        @media (min-width: 600px) {
            .cards-grid {
                grid-template-columns: repeat(2, 1fr); /* 2 columnas */
            }
        }

        /* Pantallas Grandes (PC) */
        @media (min-width: 992px) {
            /* El menú lateral se queda fijo */
            .sidebar {
                transform: translateX(0);
                position: relative;
            }

            .main-content {
                margin-left: 0;
            }

            .hamburger, .close-menu {
                display: none; /* Ocultar botones de menú */
            }

            .cards-grid {
                grid-template-columns: repeat(3, 1fr); /* 3 columnas */
            }
        }

    </style>
</head>
<body>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-logo">KHIPUSMART360</span>
            <button class="close-menu" id="closeMenu">×</button>
        </div>
        
        <div class="sidebar-menu">
            <a href="#" class="menu-item">
                <i class="fa-solid fa-graduation-cap"></i> ESTUDIANTES </a>
            <a href="#" class="menu-item">
                <i class="fa-solid fa-heart"></i> ASISTENCIAS </a>
            <a href="#" class="menu-item">
                <i class="fa-solid fa-file-signature"></i> NOTAS </a>
            <a href="#" class="menu-item">
                <i class="fa-solid fa-chart-pie"></i> REPORTES </a>
            <a href="#" class="menu-item">
                <i class="fa-solid fa-phone"></i> LLAMAR REPRESENTANTE </a>
        </div>

        <div class="sidebar-footer">
            <button class="btn-salir">
                <i class="fa-solid fa-right-from-bracket"></i> SALIR
            </button>
        </div>
    </nav>

    <main class="main-content">
        
        <header class="navbar">
            <div class="nav-left">
                <button class="hamburger" id="hamburger">≡</button>
                <span class="nav-logo">KhipuSmart360</span>
            </div>
            
            <div class="nav-right">
                <div class="user-info">
                    <div class="user-name-role">ADMIN: JURY NAVAS</div>
                    <div class="user-course">QUINTO AÑO - PARALELO "C"</div>
                </div>
                <div class="esc-logo">ESC</div>
            </div>
        </header>

        <div class="dashboard-body">
            
            <div class="cards-grid" style="grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));">
                
                <div class="card summary-card">
                    <div class="summary-title">Total Estudiantes</div>
                    <div class="summary-value">29</div>
                </div>

                <div class="card summary-card">
                    <div class="summary-title">Mejores Estudiantes</div>
                    <ul class="best-students-list">
                        <li>Alisson</li>
                        <li>Camila</li>
                        <li>José</li>
                    </ul>
                </div>

                <div class="card" style="border: 1px dashed #ccc; background: none; box-shadow: none;"></div>
            </div>

            <div class="cards-grid">
                
                <div class="card action-card card-naranja">
                    <i class="fa-solid fa-users action-icon"></i>
                    <div class="action-text">Mis Estudiantes</div>
                </div>

                <div class="card action-card card-celeste">
                    <i class="fa-solid fa-file-invoice action-icon"></i>
                    <div class="action-text">Notas</div>
                </div>

                <div class="card action-card card-rojo">
                    <i class="fa-solid fa-chart-line action-icon"></i>
                    <div class="action-text">Reportes</div>
                </div>

                <div class="card action-card card-morado">
                    <i class="fa-solid fa-calendar-check action-icon"></i>
                    <div class="action-text">Asistencias</div>
                </div>

                <div class="card action-card card-azul">
                    <i class="fa-solid fa-gear action-icon"></i>
                    <div class="action-text">Configuración</div>
                </div>

            </div>

        </div>

    </main>

    <script>
        const hamburger = document.getElementById('hamburger');
        const closeMenu = document.getElementById('closeMenu');
        const sidebar = document.getElementById('sidebar');

        // Abrir menú
        hamburger.addEventListener('click', () => {
            sidebar.classList.add('active');
        });

        // Cerrar menú
        closeMenu.addEventListener('click', () => {
            sidebar.classList.remove('active');
        });

        // Cerrar menú al hacer clic fuera (opcional, muy pro)
        document.addEventListener('click', (event) => {
            const isClickInsideSidebar = sidebar.contains(event.target);
            const isClickOnHamburger = hamburger.contains(event.target);

            if (!isClickInsideSidebar && !isClickOnHamburger && sidebar.classList.contains('active')) {
                sidebar.classList.remove('active');
            }
        });
    </script>


// bloqueioo
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  // --- TUS CREDENCIALES REALES AQUÍ ---
  const firebaseConfig = {
    apiKey: "TU_API_KEY_REAL",
    authDomain: "TU_AUTH_DOMAIN_REAL",
    projectId: "khipusmart360",
    storageBucket: "khipusmart360.appspot.com",
    messagingSenderId: "TU_ID_REAL",
    appId: "TU_APP_ID_REAL"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // Forzamos a que la sesión se guarde en el navegador
  setPersistence(auth, browserLocalPersistence)
    .then(() => {
      // Vigilante de sesión
      onAuthStateChanged(auth, (user) => {
        if (user) {
          console.log("Sesión activa para:", user.email);
          // Opcional: Aquí podemos poner el nombre en el Dashboard mañana
        } else {
          console.log("No hay sesión, redirigiendo...");
          window.location.href = "index.html";
        }
      });
    })
    .catch((error) => {
      console.error("Error de persistencia:", error);
    });

  // Botón Salir
  document.querySelector('.btn-salir').addEventListener('click', () => {
    auth.signOut().then(() => { window.location.href = "index.html"; });
  });
</script>
//
    
</body>
</html>
